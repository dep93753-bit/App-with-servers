<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Connect 4</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  :root{--c:min(12vw,calc((100vh - 190px)/7.9),74px);--me:#ff7a3d;--bot:#c4ee3c;--board:#4b3fd0;--ring:#2a1f80;--well:#150e45}
  body{background:linear-gradient(160deg,#020617,#0f172a);color:#f1f5f9;font-family:"Outfit",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px;overflow-x:hidden}
  .hud{display:flex;gap:14px;font-weight:700;font-size:14px;margin-bottom:6px}.hud b{color:#38bdf8}
  #status{min-height:1.4em;font-weight:700;font-size:15px;margin-bottom:6px;text-align:center}
  .btn{padding:10px 18px;border:none;border-radius:8px;background:rgba(255,255,255,.22);color:inherit;font-family:inherit;font-weight:700;cursor:pointer}

  .stage{position:relative;width:calc(7*var(--c));padding-top:calc(var(--c)*1.5);margin-top:6px}
  .board{position:relative;z-index:1;width:calc(7*var(--c));height:calc(6*var(--c))}
  .back{position:absolute;inset:0;background:var(--well);border-radius:20px}
  .discs{position:absolute;inset:0;z-index:1}
  .front{position:absolute;inset:0;z-index:2;border-radius:20px;pointer-events:none;
    background:radial-gradient(circle closest-side at center,transparent 0 84%,var(--ring) 85% 92%,var(--board) 93%);
    background-size:calc(100%/7) calc(100%/6);
    box-shadow:inset 0 0 0 6px rgba(255,255,255,.14),0 10px 0 var(--ring),0 20px 30px rgba(0,0,0,.5)}
  .disc{position:absolute;width:calc(var(--c)*.82);height:calc(var(--c)*.82);border-radius:50%;
    left:calc(var(--col)*var(--c) + var(--c)*.09);top:calc(var(--row)*var(--c) + var(--c)*.09);
    transition:left .7s cubic-bezier(.6,0,.3,1),top var(--fall,.4s) cubic-bezier(.5,0,.9,.6);
    box-shadow:inset 0 calc(var(--c)*-.06) 0 rgba(0,0,0,.2)}
  .disc::after{content:"";position:absolute;inset:20%;border-radius:50%;border:calc(var(--c)*.05) solid rgba(0,0,0,.2)}
  .disc.h{background:var(--me)} .disc.a{background:var(--bot)} .disc.a::after{border-style:dashed}
  .disc.ghost{opacity:.45;pointer-events:none;transition:left .1s}
  .disc.pop{animation:pop .2s} .disc.land{animation:land .22s} .disc.win{animation:glow .7s infinite alternate}
  @keyframes pop{from{transform:scale(.2)}}
  @keyframes land{40%{transform:scaleY(.9) translateY(3px)}}
  @keyframes glow{to{box-shadow:0 0 0 5px #fff,0 0 20px #fff,inset 0 calc(var(--c)*-.06) 0 rgba(0,0,0,.2)}}
  .cols{position:absolute;z-index:4;left:0;right:0;top:calc(var(--c)*.5);bottom:0;display:grid;grid-template-columns:repeat(7,1fr)}
  .col{background:none;border:0;padding:0;cursor:pointer;border-radius:14px}
  .col:focus-visible{outline:3px solid var(--me)}

  /* robot hand */
  .rail{position:absolute;z-index:2;left:-10px;right:-10px;top:calc(var(--c)*.2);height:10px;border-radius:6px;background:linear-gradient(#c9ced9,#8d95a9);box-shadow:0 3px 0 rgba(0,0,0,.3)}
  .hand{position:absolute;z-index:3;top:0;left:calc(var(--col)*var(--c));width:var(--c);height:calc(var(--c)*1.5);transition:left .7s cubic-bezier(.6,0,.3,1);pointer-events:none}
  .carriage{position:absolute;left:6%;right:6%;top:calc(var(--c)*.1);height:calc(var(--c)*.28);border-radius:9px;background:linear-gradient(#d4d9e4,#9aa2b4);box-shadow:inset 0 -3px 0 #7b8397,0 3px 0 rgba(0,0,0,.3)}
  .led{position:absolute;left:50%;top:50%;width:calc(var(--c)*.1);height:calc(var(--c)*.1);margin:calc(var(--c)*-.05);border-radius:50%;background:var(--bot);box-shadow:0 0 8px var(--bot)}
  .hand.think .led{animation:blink .35s infinite alternate}
  @keyframes blink{to{opacity:.15}}
  .rod{position:absolute;left:50%;top:calc(var(--c)*.36);height:calc(var(--c)*.26);width:calc(var(--c)*.13);margin-left:calc(var(--c)*-.065);background:repeating-linear-gradient(#aab1c2 0 6px,#8d95a9 6px 8px);border-radius:3px}
  .hand svg{position:absolute;left:0;bottom:0;width:var(--c);height:var(--c);overflow:visible}
  .f{transition:transform .25s ease-out}.fl{transform-origin:24px 8px}.fr{transform-origin:76px 8px}
  .hand.open .fl{transform:rotate(26deg)}.hand.open .fr{transform:rotate(-26deg)}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
</head>
<body>
<div class="hud"><span>Score <b id="sc">0</b></span><span>Drops <b id="am">0</b></span><span>Strikes <b id="wr">0</b>/3</span></div>
<div id="status" aria-live="polite"></div>

<div class="stage">
  <div class="rail"></div>
  <div class="hand open" id="hand" style="--col:3">
    <div class="carriage"><div class="led"></div></div>
    <div class="rod"></div>
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <g class="f fl"><path d="M24 8 Q4 20 6 52 Q7 62 18 70" fill="none" stroke="#6b7388" stroke-width="12" stroke-linecap="round"/><path d="M24 8 Q4 20 6 52 Q7 62 18 70" fill="none" stroke="#b9c0d0" stroke-width="7" stroke-linecap="round"/></g>
      <g class="f fr"><path d="M76 8 Q96 20 94 52 Q93 62 82 70" fill="none" stroke="#6b7388" stroke-width="12" stroke-linecap="round"/><path d="M76 8 Q96 20 94 52 Q93 62 82 70" fill="none" stroke="#b9c0d0" stroke-width="7" stroke-linecap="round"/></g>
      <rect x="20" y="0" width="60" height="14" rx="5" fill="#9aa2b4" stroke="#6b7388" stroke-width="3"/><circle cx="50" cy="7" r="3" fill="#6b7388"/>
    </svg>
  </div>
  <div class="board"><div class="back"></div><div class="discs" id="discs"></div><div class="front"></div></div>
  <div class="cols" id="cols"></div>
</div>

<script src="quiz-modal.js"></script>
<script>
(function () {
  "use strict";
  var R = 6, C = 7, H = 1, A = 2, ORDER = [3, 2, 4, 1, 5, 0, 6], DEPTH = 4;
  var $ = function (i) { return document.getElementById(i); };
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var hand = $('hand'), discs = $('discs'), g, busy, ghost, handCol = 3, won = false;

  // Drops = your ammo. Run out -> answer a question. 3 wrong answers = game over.
  var K = GameKit({ id: 'connect4', ammo: 6, gainCorrect: 5, gainWrong: 1, maxWrong: 3, onUpdate: hud,
    getScore: function () { return K.answers.filter(function (a) { return a.correct; }).length * 10 + (won ? 100 : 0); }, restart: start });

  function hud() { $('sc').textContent = K.answers.filter(function (a) { return a.correct; }).length * 10 + (won ? 100 : 0); $('am').textContent = K.ammo; $('wr').textContent = K.wrong; }
  function say(t) { $('status').textContent = t; }

  /* ---------- logic ---------- */
  function drop(b, c, p) { for (var r = R - 1; r >= 0; r--) if (!b[r][c]) { b[r][c] = p; return r; } return -1; }
  function winCells(b, r, c, p) {
    var dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    for (var d = 0; d < 4; d++) {
      var dr = dirs[d][0], dc = dirs[d][1], cells = [[r, c]];
      [1, -1].forEach(function (s) {
        var y = r + dr * s, x = c + dc * s;
        while (y >= 0 && y < R && x >= 0 && x < C && b[y][x] === p) { cells.push([y, x]); y += dr * s; x += dc * s; }
      });
      if (cells.length >= 4) return cells;
    }
    return null;
  }
  function evalBoard(b) {
    var s = 0, dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    for (var r = 0; r < R; r++) { if (b[r][3] === A) s += 3; else if (b[r][3] === H) s -= 3; }
    dirs.forEach(function (d) {
      for (var r = 0; r < R; r++) for (var c = 0; c < C; c++) {
        var er = r + d[0] * 3, ec = c + d[1] * 3; if (er < 0 || er >= R || ec < 0 || ec >= C) continue;
        var a = 0, h = 0;
        for (var k = 0; k < 4; k++) { var v = b[r + d[0] * k][c + d[1] * k]; if (v === A) a++; else if (v === H) h++; }
        if (a && h) continue;
        if (a === 3) s += 6; else if (a === 2) s += 2;
        if (h === 3) s -= 8; else if (h === 2) s -= 2;
      }
    });
    return s;
  }
  function negamax(b, d, al, be, p) {
    var any = false, best = -Infinity;
    for (var i = 0; i < C; i++) {
      var c = ORDER[i]; if (b[0][c]) continue; any = true;
      var r = drop(b, c, p), v;
      if (winCells(b, r, c, p)) v = 1e6 + d;
      else if (d <= 1) v = (p === A ? 1 : -1) * evalBoard(b);
      else v = -negamax(b, d - 1, -be, -al, 3 - p);
      b[r][c] = 0;
      if (v > best) best = v; if (best > al) al = best; if (al >= be) break;
    }
    return any ? best : 0;
  }
  function pickMove() {
    var open = ORDER.filter(function (c) { return !g[0][c]; }), best = -Infinity, bc = open[0];
    if (Math.random() < 0.12) return open[Math.random() * open.length | 0];   // the robot sometimes slips, so kids can win
    open.forEach(function (c) {
      var r = drop(g, c, A), v;
      if (winCells(g, r, c, A)) v = 1e7; else v = -negamax(g, DEPTH - 1, -Infinity, Infinity, H);
      g[r][c] = 0; if (v > best) { best = v; bc = c; }
    });
    return bc;
  }

  /* ---------- visuals ---------- */
  function setHand(c) { handCol = c; hand.style.setProperty('--col', c); }
  function makeDisc(p, col, row, cls) {
    var d = document.createElement('div'); d.className = 'disc ' + (p === H ? 'h' : 'a') + ' ' + (cls || '');
    d.style.setProperty('--col', col); d.style.setProperty('--row', row); discs.appendChild(d); return d;
  }
  async function fall(d, row) {
    var t = .22 + .06 * (row + 1);
    d.style.setProperty('--fall', t + 's'); d.offsetWidth; d.style.setProperty('--row', row);
    await sleep(t * 1000 + 40); d.classList.add('land');
  }
  function finish(p, r, c) {            // returns true if the game ended
    var w = winCells(g, r, c, p);
    if (w) {
      [].forEach.call(discs.querySelectorAll('.disc:not(.ghost)'), function (d) {
        var col = +d.style.getPropertyValue('--col'), row = +d.style.getPropertyValue('--row');
        if (w.some(function (x) { return x[0] === row && x[1] === col; })) d.classList.add('win');
      });
      won = (p === H); say(won ? 'Four in a row — you win!' : 'The robot got four in a row.'); hud();
      setTimeout(function () { K.end(won); }, 1100); return true;
    }
    if (g[0].every(Boolean)) { say('Draw — the board is full.'); setTimeout(function () { K.end(false); }, 900); return true; }
    return false;
  }

  async function humanMove(c) {
    if (busy || K.over || g[0][c] || K.ammo <= 0) return;
    busy = true; ghost.style.display = 'none'; K.ammo--; hud();
    var r = drop(g, c, H), d = makeDisc(H, c, -1);
    await fall(d, r);
    if (finish(H, r, c)) return;
    await robotTurn();
    if (K.over) return;
    if (K.ammo <= 0) { say('Out of drops — answer a question to reload.'); K.ask(function () { busy = false; say('Your turn — pick a column.'); }); }
    else busy = false;
  }
  async function robotTurn() {
    say('Robot is thinking…'); hand.classList.add('think'); await sleep(450);
    var c = pickMove(); hand.classList.remove('think');
    var r = drop(g, c, A); g[r][c] = 0;
    var d = makeDisc(A, handCol, -1, 'pop');
    await sleep(250); hand.classList.remove('open');            // grab
    await sleep(300);
    setHand(c); d.style.setProperty('--col', c);                // carry
    await sleep(760);
    hand.classList.add('open'); await sleep(200);               // release
    g[r][c] = A; await fall(d, r);
    var ended = finish(A, r, c); setHand(3);
    if (!ended) say('Your turn — pick a column.');
  }

  function start() {
    g = []; for (var r = 0; r < R; r++) g.push(Array(C).fill(0));
    busy = false; won = false; discs.innerHTML = '';
    hand.classList.add('open'); hand.classList.remove('think'); setHand(3);
    ghost = makeDisc(H, 3, -1, 'ghost'); ghost.style.display = 'none';
    say('Your turn — pick a column.'); hud();
  }

  var cols = $('cols');
  for (var i = 0; i < C; i++) (function (c) {
    var b = document.createElement('button'); b.className = 'col'; b.setAttribute('aria-label', 'Drop in column ' + (c + 1));
    var show = function () { if (!busy && !K.over && !g[0][c]) { ghost.style.setProperty('--col', c); ghost.style.display = ''; } };
    b.addEventListener('mouseenter', show); b.addEventListener('focus', show);
    b.addEventListener('click', function () { humanMove(c); });
    cols.appendChild(b);
  })(i);
  cols.addEventListener('mouseleave', function () { ghost.style.display = 'none'; });
  start();
})();
</script>
</body>
</html>
