# Runs the ClassQuiz browser tests on every pull request (and on main), so a change
# that breaks something shows a red X before it's merged.
name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    # pinned: ubuntu-latest moved to 26.04, which Playwright 1.56 cannot install Chromium on
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
