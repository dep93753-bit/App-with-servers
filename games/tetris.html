<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tetris</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  body{background:#000;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:8px;touch-action:manipulation}
  .hud{display:flex;gap:12px;font-size:10px;margin:6px 0 14px;flex-wrap:wrap;justify-content:center}.hud b{color:#3ac7e6}
  .play{display:flex;gap:16px;align-items:flex-start}
  canvas{display:block;background:#000}
  #board{height:min(600px,64vh);aspect-ratio:1/2;width:auto}
  .side{display:flex;flex-direction:column;align-items:center;gap:10px;width:88px}
  .side small{font-size:10px;color:#aaa;text-transform:uppercase}
  #next{width:84px;height:84px}
  .pad{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;padding:3px}
  .btn{--px-line:#fff;padding:11px 0;background:#000;color:#fff;font-size:14px;cursor:pointer;touch-action:manipulation}
  .wide{grid-column:1/-1;font-size:11px}
</style>
</head>
<body class="px">
<div class="hud"><span>Lines <b id="sc">0</b>/10</span><span>Pieces <b id="am">0</b></span><span>Strikes <b id="wr">0</b>/3</span></div>
<div class="play">
  <canvas id="board" class="pxframe" width="80" height="160"></canvas>
  <div class="side">
    <small>Next</small><canvas id="next" class="pxframe" width="40" height="40"></canvas>
    <div class="pad">
      <button class="btn" id="bL">◀</button><button class="btn" id="bR">▶</button>
      <button class="btn" id="bRot">↻</button><button class="btn" id="bD">▼</button>
      <button class="btn wide" id="bDrop">DROP</button>
    </div>
  </div>
</div>

<script src="quiz-modal.js?v=3"></script>
<script src="pixel.js?v=3"></script>
<script>
(function () {
  "use strict";
  var COLS = 10, ROWS = 20, B = 8, WIN_LINES = 10, POINTS = [0, 100, 300, 600, 1000];
  var PIECES = [
    { s: [[1,1,1,1]], c: '#3ac7e6' }, { s: [[1,1],[1,1]], c: '#f5e03a' }, { s: [[0,1,0],[1,1,1]], c: '#b484e0' },
    { s: [[0,1,1],[1,1,0]], c: '#5fdb6b' }, { s: [[1,1,0],[0,1,1]], c: '#e85f5f' },
    { s: [[1,0,0],[1,1,1]], c: '#f0a34b' }, { s: [[0,0,1],[1,1,1]], c: '#5b8cf0' }
  ];
  var $ = function (i) { return document.getElementById(i); };
  var cx = $('board').getContext('2d'), nx = $('next').getContext('2d');
  var board, cur, nxt, lines, score, paused, timer;

  // Each piece that appears uses 1 "piece". At 0 pieces you answer a question to get more.
  var K = GameKit({ id: 'tetris', ammo: 12, gainCorrect: 10, gainWrong: 2, maxWrong: 3, onUpdate: hud, getScore: function () { return score; }, restart: start });

  function hud() { $('sc').textContent = lines; $('am').textContent = K.ammo; $('wr').textContent = K.wrong; }
  function rnd() { var p = PIECES[Math.random() * PIECES.length | 0]; return { s: p.s.map(function (r) { return r.slice(); }), c: p.c }; }
  function hit(p, s, x, y) {
    s = s || p.s; x = x == null ? p.x : x; y = y == null ? p.y : y;
    for (var r = 0; r < s.length; r++) for (var c = 0; c < s[0].length; c++) if (s[r][c]) {
      var bx = x + c, by = y + r;
      if (bx < 0 || bx >= COLS || by >= ROWS || (by >= 0 && board[by][bx])) return true;
    }
    return false;
  }
  function spawn() {
    if (K.ammo <= 0) { paused = true; K.ask(function () { paused = false; spawn(); }); return; }
    K.ammo--; cur = nxt || rnd(); nxt = rnd();
    cur.x = (COLS - cur.s[0].length) >> 1; cur.y = 0; hud();
    if (hit(cur)) { draw(); K.end(false); return; }
    draw();
  }
  function move(dx, dy) { if (hit(cur, null, cur.x + dx, cur.y + dy)) return false; cur.x += dx; cur.y += dy; return true; }
  function rotate() {
    var s = cur.s, rs = s[0].map(function (_, c) { return s.map(function (row) { return row[c]; }).reverse(); });
    [0, -1, 1, -2, 2].some(function (k) { if (!hit(cur, rs, cur.x + k, cur.y)) { cur.s = rs; cur.x += k; return true; } });
  }
  function lock() {
    cur.s.forEach(function (row, r) { row.forEach(function (v, c) { if (v && cur.y + r >= 0) board[cur.y + r][cur.x + c] = cur.c; }); });
    var n = 0;
    for (var r = ROWS - 1; r >= 0;) {
      if (board[r].every(Boolean)) { board.splice(r, 1); board.unshift(Array(COLS).fill(null)); n++; } else r--;
    }
    if (n) { lines += n; score += POINTS[Math.min(n, 4)]; }
    hud();
    if (lines >= WIN_LINES) { draw(); K.end(true); } else spawn();
  }
  function drop() { while (move(0, 1)); lock(); draw(); }
  function tick() { if (paused || K.over) return; if (!move(0, 1)) lock(); draw(); }

  // Chunky retro pixels: the board is only 80 x 160 pixels, enlarged without blurring; flat blocks on black
  function draw() {
    cx.fillStyle = '#000'; cx.fillRect(0, 0, 80, 160);
    board.forEach(function (row, r) { row.forEach(function (c, x) { if (c) PX.block(cx, x * B, r * B, B, c); }); });
    if (cur) cur.s.forEach(function (row, r) { row.forEach(function (v, c) { if (v && cur.y + r >= 0) PX.block(cx, (cur.x + c) * B, (cur.y + r) * B, B, cur.c); }); });
    nx.fillStyle = '#000'; nx.fillRect(0, 0, 40, 40);
    if (nxt) { var s = 8, ox = Math.round((40 - nxt.s[0].length * s) / 2), oy = Math.round((40 - nxt.s.length * s) / 2);
      nxt.s.forEach(function (row, r) { row.forEach(function (v, c) { if (v) PX.block(nx, ox + c * s, oy + r * s, s, nxt.c); }); }); }
  }
  function start() {
    board = Array.from({ length: ROWS }, function () { return Array(COLS).fill(null); });
    lines = 0; score = 0; nxt = null; paused = false; cur = null;
    clearInterval(timer); timer = setInterval(tick, 500); spawn();
  }

  function act(fn) { return function (e) { if (e) e.preventDefault(); if (paused || K.over || !cur) return; fn(); draw(); }; }
  [['bL', function () { move(-1, 0); }], ['bR', function () { move(1, 0); }], ['bRot', rotate], ['bD', function () { if (!move(0, 1)) lock(); }], ['bDrop', drop]]
    .forEach(function (b) { $(b[0]).addEventListener('pointerdown', act(b[1])); });
  window.addEventListener('keydown', function (e) {
    var m = { ArrowLeft: function () { move(-1, 0); }, ArrowRight: function () { move(1, 0); }, ArrowUp: rotate, ArrowDown: function () { if (!move(0, 1)) lock(); }, ' ': drop }[e.key];
    if (m) act(m)(e);
  });
  start();
})();
</script>
</body>
</html>
