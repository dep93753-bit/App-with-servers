<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#031018">
<title>Battleship - Top-Down Naval Command</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#031018;color:#e8f6fb;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:disabled{cursor:not-allowed}
button:focus-visible{outline:2px solid #f0c14b;outline-offset:2px}
ul{list-style:none}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- menu ---------- */
#menu{position:relative;min-height:100dvh;overflow:hidden}
#backdrop{position:fixed;inset:0;width:100%;height:100%}
.menu-main{position:relative;z-index:1;margin:0 auto;display:flex;min-height:100dvh;max-width:32rem;flex-direction:column;align-items:center;justify-content:center;gap:2rem;padding:2.5rem 1.25rem;text-align:center}
.logo{width:56px;height:56px;margin:0 auto 1rem;display:grid;place-items:center;border-radius:1rem;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);backdrop-filter:blur(8px);color:#f0c14b}
.logo .i{width:28px;height:28px}
.menu-main h1{font-size:clamp(3rem,10vw,3.75rem);font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.menu-main .sub{margin-top:.75rem;font-size:1.1rem;color:rgba(255,255,255,.75);text-wrap:pretty}
.levels{display:grid;width:100%;gap:.75rem}
.level{display:flex;min-height:64px;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:.875rem 1.25rem;border-radius:1rem;border:1px solid;backdrop-filter:blur(8px);transition:transform .15s,border-color .15s}
.level:hover{transform:translateY(-2px)}
.level b{font-size:1.1rem}
.level span{font-size:.875rem;color:rgba(255,255,255,.7)}
.level.easy{background:linear-gradient(#34d3991f,#34d3990d);border-color:rgba(110,231,183,.4)}.level.easy:hover{border-color:#6ee7b7}
.level.medium{background:linear-gradient(#fcd34d1f,#fcd34d0d);border-color:rgba(253,230,138,.4)}.level.medium:hover{border-color:#fde68a}
.level.hard{background:linear-gradient(#f871711f,#f871710d);border-color:rgba(252,165,165,.4)}.level.hard:hover{border-color:#fca5a5}
.tips{display:grid;width:100%;gap:.5rem;padding:1rem;text-align:left;font-size:.875rem;color:rgba(255,255,255,.8);border-radius:1rem;border:1px solid rgba(255,255,255,.1);background:rgba(4,19,29,.7);backdrop-filter:blur(8px)}
.tips li{display:flex;gap:.75rem}
.tips .i{margin-top:2px;color:#f0c14b}

/* ---------- game ---------- */
#game{position:relative;min-height:100dvh;padding-bottom:2.5rem;background:radial-gradient(ellipse at 20% 0%,rgba(20,112,143,.35),transparent 55%),linear-gradient(170deg,#031018,#05202f 45%,#08364a)}
.wrap{max-width:72rem;margin:0 auto;padding:0 1rem}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;padding-top:1rem}
.top h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.badge{padding:.25rem .75rem;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.ammo{display:flex;align-items:center;gap:.5rem;padding:.25rem .875rem .25rem .75rem;border-radius:999px;border:1px solid rgba(240,193,75,.3);background:rgba(240,193,75,.1);color:#f0c14b}
.pips{display:flex;align-items:flex-end;gap:4px}
.pip{width:8px;height:16px;border-radius:999px 999px 2px 2px;background:rgba(255,255,255,.15);transition:background .2s}
.pip.on{background:#f0c14b;box-shadow:0 0 8px rgba(240,193,75,.7)}
.ammo b{font-size:.875rem;font-variant-numeric:tabular-nums}
.spacer{margin-left:auto}
.top .right{display:flex;align-items:center;gap:.5rem;margin-left:auto}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:.75rem;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);transition:background .15s}
.icon-btn:hover{background:rgba(255,255,255,.2)}
.icon-btn .i{width:20px;height:20px}
.btn{display:inline-flex;min-height:44px;align-items:center;gap:.5rem;padding:0 .875rem;border-radius:.75rem;border:1px solid rgba(255,255,255,.2);font-size:.875rem;font-weight:600;transition:background .15s}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.solid{background:rgba(255,255,255,.15);border-color:transparent}.btn.solid:hover{background:rgba(255,255,255,.25)}
.btn:disabled{opacity:.4}
.btn .kbd{padding:2px 6px;border-radius:4px;background:rgba(0,0,0,.3);font-size:10px;font-weight:700;color:rgba(255,255,255,.7)}
.gold{display:inline-flex;min-height:44px;align-items:center;justify-content:center;gap:.5rem;padding:0 1.5rem;border-radius:.75rem;background:#f0c14b;color:#1a1405;font-size:.875rem;font-weight:800;box-shadow:0 6px 24px -6px rgba(240,193,75,.7);transition:filter .15s}
.gold:hover:not(:disabled){filter:brightness(1.1)}
.gold:disabled{background:rgba(255,255,255,.15);color:rgba(255,255,255,.4);box-shadow:none}
.hudrow{display:flex;align-items:center;gap:.75rem;margin-top:.75rem}
#hud{flex:1;min-height:44px;padding:.625rem 1rem;border-radius:.75rem;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);font-size:.875rem;font-weight:600;line-height:1.35;color:rgba(255,255,255,.85)}
#hud.mine{border-color:rgba(240,193,75,.5);background:rgba(240,193,75,.1);color:#ffe6a3}
#hud.theirs{border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.1);color:#fee2e2}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:.75rem;padding:4px;border-radius:.75rem;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.25)}
.tabs button{min-height:40px;border-radius:.5rem;font-size:.875rem;font-weight:700;color:rgba(255,255,255,.6);transition:background .15s}
.tabs button[aria-selected=true]{background:rgba(255,255,255,.2);color:#fff}
.boards{display:grid;gap:1.5rem;margin-top:1rem}
.panel{display:flex;width:100%;flex-direction:column;gap:.625rem;min-width:0}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem;padding:0 4px}
.panel-head h2{display:flex;align-items:center;gap:.5rem;font-size:1rem;font-weight:700;letter-spacing:.02em}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)}
.dot.on{background:#f0c14b;box-shadow:0 0 10px #f0c14b}
.cap{font-size:.75rem;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board-wrap{position:relative;aspect-ratio:1;width:100%;overflow:hidden;border-radius:1rem;background:#062235;box-shadow:0 0 0 1px rgba(160,230,255,.18),0 20px 60px -20px rgba(0,0,0,.8)}
.board-wrap canvas{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}
.banner-layer{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.banner{font-size:clamp(2.25rem,6vw,3rem);font-weight:900;text-transform:uppercase;letter-spacing:.12em;animation:bs-banner 1.4s ease-out both}
.banner.hit{color:#ffb347;text-shadow:0 2px 12px rgba(255,120,30,.8)}
.banner.miss{color:#d7f3ff;text-shadow:0 2px 12px rgba(120,200,255,.7)}
.banner.sunk{color:#ff6b5e;text-shadow:0 2px 16px rgba(255,60,40,.9)}
.fleetlist{display:flex;flex-wrap:wrap;align-items:center;gap:6px 1rem;padding:0 4px}
.fleetlist li{display:flex;align-items:center;gap:6px}
.fleetlist span{font-size:11px;font-weight:600;color:rgba(255,255,255,.6)}
.fleetlist li.sunk span{color:#fca5a5;text-decoration:line-through}
.fleetlist li canvas{opacity:.9}.fleetlist li.sunk canvas{opacity:.4}
.placebar{display:flex;flex-direction:column;gap:.75rem;padding:.75rem;border-radius:1rem;border:1px solid rgba(255,255,255,.1);background:rgba(4,19,29,.8);backdrop-filter:blur(8px)}
.tray{display:flex;flex-wrap:wrap;gap:.5rem}
.ship-btn{display:flex;min-height:56px;align-items:center;gap:.625rem;padding:.5rem .75rem;border-radius:.75rem;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);text-align:left;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;transition:border-color .15s,background .15s}
.ship-btn:hover:not(:disabled){border-color:rgba(255,255,255,.4)}
.ship-btn.sel{border-color:#f0c14b;background:rgba(240,193,75,.15)}
.ship-btn:disabled{cursor:not-allowed;border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.1);color:rgba(255,255,255,.6)}
.ship-btn:disabled canvas{opacity:.5}
.ship-btn .txt{display:flex;flex-direction:column;line-height:1.2}
.ship-btn .txt b{font-size:.875rem}
.ship-btn .txt small{font-size:11px;color:rgba(255,255,255,.55)}
.ship-btn .ok{color:#6ee7b7;display:none}.ship-btn:disabled .ok{display:block}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.actions .btn{background:rgba(255,255,255,.1)}.actions .btn:hover:not(:disabled){background:rgba(255,255,255,.2)}
.actions .btn.ghostb{background:transparent}.actions .btn.ghostb:hover:not(:disabled){background:rgba(255,255,255,.1)}
.actions .gold{margin-left:auto}
.help{font-size:.75rem;line-height:1.6;color:rgba(255,255,255,.55)}
#game[data-phase=placement] .tabs{display:none}
#game[data-phase=placement] .panel.enemy{display:none}
#game:not([data-phase=placement]) .placebar{display:none}
@media(max-width:1023px){
 #game:not([data-phase=placement])[data-view=enemy] .panel.own{display:none}
 #game:not([data-phase=placement])[data-view=own] .panel.enemy{display:none}
}
@media(min-width:1024px){
 .tabs{display:none}
 .boards{grid-template-columns:1fr 1fr;gap:2rem}
 #game[data-phase=placement] .boards{grid-template-columns:minmax(0,620px) minmax(0,1fr);align-items:start}
 .placebar{padding:1rem}
}
@media(max-width:639px){.hide-sm{display:none}}

/* ---------- modals ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(2,11,18,.8);backdrop-filter:blur(4px)}
.modal{width:100%;border-radius:1.5rem;border:1px solid rgba(255,255,255,.1);background:linear-gradient(#0b3347,#071e2c);box-shadow:0 25px 50px -12px rgba(0,0,0,.6);animation:bs-pop .28s ease-out both}
.modal.quiz{max-width:28rem;padding:1.5rem}
.modal.result{max-width:24rem;padding:1.75rem;text-align:center}
.eyebrow{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.2em;color:#f0c14b}
.modal h2{margin-top:.5rem;font-size:1.25rem;font-weight:700;line-height:1.35;text-wrap:balance}
.modal .meta{margin-top:.25rem;font-size:.875rem;color:rgba(255,255,255,.6)}
.opts{display:grid;gap:.625rem;margin-top:1.25rem}
.opt{display:flex;min-height:48px;align-items:center;justify-content:space-between;gap:.75rem;padding:.75rem 1rem;border-radius:.75rem;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);text-align:left;font-weight:600;transition:background .15s,border-color .15s}
.opt:hover:not(:disabled){border-color:rgba(240,193,75,.7);background:rgba(255,255,255,.1)}
.opt:disabled{opacity:.6}
.opt.right{opacity:1;border-color:#34d399;background:rgba(52,211,153,.2);color:#d1fae5}
.opt.wrong{opacity:1;border-color:#f87171;background:rgba(248,113,113,.2);color:#fee2e2}
.qmsg{margin-top:1rem;min-height:1.5rem;font-size:.875rem;font-weight:600}
.result .eyebrow{letter-spacing:.25em}
.result .eyebrow.win{color:#6ee7b7}.result .eyebrow.lose{color:#fca5a5}
.result h2{font-size:2.25rem;font-weight:900}
.result p.m{margin-top:.5rem;color:rgba(255,255,255,.7)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:1.25rem}
.stats div{padding:.75rem .5rem;border-radius:.75rem;background:rgba(255,255,255,.05)}
.stats dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.55)}
.stats dd{margin-top:2px;font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums}
.rbtns{display:grid;gap:.625rem;margin-top:1.5rem}
.rbtns .gold{min-height:48px;box-shadow:none;font-size:1rem}
.rbtns .out{min-height:48px;border-radius:.75rem;border:1px solid rgba(255,255,255,.2);font-weight:600;transition:background .15s}
.rbtns .out:hover{background:rgba(255,255,255,.1)}

@keyframes bs-pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes bs-banner{0%{opacity:0;transform:scale(.6)}18%{opacity:1;transform:scale(1.12)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px) scale(1)}}
@media(prefers-reduced-motion:reduce){.modal,.banner{animation-duration:.01s}}
</style>
</head>
<body>

<div id="menu">
  <canvas id="backdrop" aria-hidden="true"></canvas>
  <main class="menu-main">
    <div>
      <div class="logo" id="logoIcon"></div>
      <h1>Battleship</h1>
      <p class="sub">Command your fleet from above. Live seas, real shells, one admiral.</p>
    </div>
    <div class="levels" id="levels" role="group" aria-label="Choose difficulty"></div>
    <ul class="tips" id="tips"></ul>
  </main>
</div>

<div id="game" hidden data-phase="menu" data-view="own">
  <header class="wrap top">
    <h1>Battleship</h1>
    <span class="badge" id="levelBadge"></span>
    <div class="ammo" id="ammo" role="status"><span id="zapIcon"></span><span class="pips" id="pips" aria-hidden="true"></span><b id="ammoNum"></b></div>
    <div class="right">
      <button class="icon-btn" id="muteBtn" type="button"></button>
      <button class="btn" id="levelBtn" type="button"><span id="homeIcon"></span><span class="hide-sm">Level</span><span class="sr-only">Change level</span></button>
      <button class="btn solid" id="newBtn" type="button"><span id="resetIcon"></span><span class="hide-sm">New game</span><span class="sr-only">New game</span></button>
    </div>
  </header>
  <div class="wrap hudrow">
    <p id="hud" aria-live="polite"></p>
    <button class="gold" id="reloadBtn" type="button" hidden style="box-shadow:none">Reload</button>
  </div>
  <div class="wrap">
    <div class="tabs" id="tabs" role="tablist" aria-label="Board view">
      <button type="button" role="tab" data-view="enemy">Enemy waters</button>
      <button type="button" role="tab" data-view="own">Your fleet</button>
    </div>
  </div>
  <main class="wrap boards" id="boards">
    <div id="ownSlot" style="display:contents"></div>
    <div class="placebar" id="placebar">
      <ul class="tray" id="tray" aria-label="Fleet"></ul>
      <div class="actions">
        <button class="btn" id="rotateBtn" type="button"><span id="rotIcon"></span>Rotate<span class="kbd" aria-hidden="true">R</span></button>
        <button class="btn" id="shuffleBtn" type="button"><span id="shufIcon"></span>Auto-place</button>
        <button class="btn ghostb" id="clearBtn" type="button"><span id="trashIcon"></span>Clear</button>
        <button class="gold" id="readyBtn" type="button">Open fire</button>
      </div>
      <p class="help">Drag a ship onto the grid, or tap one and touch the water. Touch drags float the ship above your finger. Tap a deployed ship to rotate it, drag it to move it.</p>
    </div>
    <div id="enemySlot" style="display:contents"></div>
  </main>
</div>
<div id="modalRoot"></div>

<script>
(() => {
'use strict'

/* =========================================================================
   Icons
   ========================================================================= */
const ICONS = {
  zap: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
  home: '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  reset: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  rotate: '<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>',
  vol: '<path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/>',
  mute: '<path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/>',
  shuffle: '<path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  anchor: '<path d="M12 6v16"/><path d="m19 13 2-1a9 9 0 0 1-18 0l2 1"/><path d="M9 11h6"/><circle cx="12" cy="4" r="2"/>',
  cross: '<circle cx="12" cy="12" r="10"/><line x1="22" x2="18" y1="12" y2="12"/><line x1="6" x2="2" y1="12" y2="12"/><line x1="12" x2="12" y1="6" y2="2"/><line x1="12" x2="12" y1="22" y2="18"/>',
  move: '<path d="m5 9-3 3 3 3"/><path d="m9 5 3-3 3 3"/><path d="m15 19-3 3-3-3"/><path d="m19 9 3 3-3 3"/><path d="M2 12h20"/><path d="M12 2v20"/>',
  ok: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  bad: '<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>',
}
const icon = (n) => '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[n] + '</svg>'
const $ = (id) => document.getElementById(id)

/* =========================================================================
   Game logic
   ========================================================================= */
const SIZE = 10
const LETTERS = 'ABCDEFGHIJ'
const FLEET = [
  { id: 'carrier', name: 'Carrier', length: 5 },
  { id: 'battleship', name: 'Battleship', length: 4 },
  { id: 'cruiser', name: 'Cruiser', length: 3 },
  { id: 'submarine', name: 'Submarine', length: 3 },
  { id: 'destroyer', name: 'Destroyer', length: 2 },
]
const LEVELS = [
  { id: 'easy', name: 'Recruit', desc: 'Enemy fires at random' },
  { id: 'medium', name: 'Officer', desc: 'Enemy hunts after a hit' },
  { id: 'hard', name: 'Admiral', desc: 'Hunts, tracks lines & uses parity' },
]
const DEFAULT_QUESTIONS = [
  { question: 'What is the capital of Australia?', options: ['Sydney', 'Canberra', 'Melbourne', 'Perth'], correct: 1 },
  { question: 'Which planet is known as the Red Planet?', options: ['Venus', 'Jupiter', 'Mars', 'Mercury'], correct: 2 },
  { question: 'What is 12 \u00d7 12?', options: ['124', '132', '144', '156'], correct: 2 },
  { question: 'Which ocean is the largest?', options: ['Atlantic', 'Indian', 'Arctic', 'Pacific'], correct: 3 },
  { question: 'What gas do plants absorb from the air?', options: ['Oxygen', 'Carbon dioxide', 'Nitrogen', 'Helium'], correct: 1 },
  { question: 'Who wrote "Romeo and Juliet"?', options: ['Dickens', 'Austen', 'Shakespeare', 'Twain'], correct: 2 },
  { question: 'How many continents are there?', options: ['5', '6', '7', '8'], correct: 2 },
  { question: 'What is the chemical symbol for water?', options: ['O2', 'H2O', 'CO2', 'HO'], correct: 1 },
  { question: 'What is the square root of 81?', options: ['7', '8', '9', '10'], correct: 2 },

const WATER_LIFE = 3.2

class Water {
  constructor(baseRes) {
    this.baseRes = baseRes || 120
    this.off = document.createElement('canvas')
    this.octx = this.off.getContext('2d')

  }

    const lh = Math.max(8, Math.round(this.baseRes / aspect))

      this.lw = lw; this.lh = lh

    const active = ripples.filter((r) => t - r.t0 < WATER_LIFE && t - r.t0 >= 0)
    const rc = active.length

    for (let i = 0; i < rc; i++) {

      rx.push(r.x); ry.push(r.y)
      rrad.push(age * (r.speed || 3.6))
      rfade.push(r.strength * (1 - age / WATER_LIFE) * (1 - age / WATER_LIFE))
    }
    let p = 0
    for (let y = 0; y < lh; y++) {
      const v = ((y + 0.5) / lh) * worldH
      for (let x = 0; x < lw; x++) {
        const u = ((x + 0.5) / lw) * worldW
        const a = Math.sin(u * 1.35 + t * 0.8 + Math.sin(v * 0.9 + t * 0.4) * 1.2)
        const b = Math.sin(v * 1.7 - t * 0.65 + Math.sin(u * 1.1 - t * 0.3) * 1.4)

        const r2 = ridge * ridge, r4 = r2 * r2
        const caustic = r4 * r4
        let glint = 0
        for (let i = 0; i < rc; i++) {
          const dx = u - rx[i], dy = v - ry[i]
          const d = Math.sqrt(dx * dx + dy * dy)
          const delta = d - rrad[i]
          if (delta > 1.6 || delta < -1.6) continue
          const env = Math.exp(-delta * delta * 2.2) * rfade[i]
          const wave = Math.cos(delta * 7)

        const li = idx * 3

        data[p++] = LUT[li] + boost * 0.7
        data[p++] = LUT[li + 1] + boost * 0.95
        data[p++] = LUT[li + 2] + boost
        data[p++] = 255
      }
    }
    this.octx.putImageData(this.img, 0, 0)
    ctx.imageSmoothingEnabled = true
    ctx.imageSmoothingQuality = 'high'
    ctx.drawImage(this.off, 0, 0, W, H)
  }
}

  const sOff = o.lifted ? 0.2 : 0.08
  ctx.translate(o.x + o.cell * sOff, o.y + o.cell * (sOff + 0.04))
  ctx.rotate(o.angle); ctx.scale(o.cell * lift, o.cell * lift)
  ctx.fillStyle = sunk ? 'rgba(0,10,14,.18)' : 'rgba(0,18,28,.34)'
  hullPath(ctx, x0, x1, spec.hw, spec.bow, round); ctx.fill()
  ctx.restore()

  ctx.translate(o.x, o.y); ctx.rotate(o.angle + bobR)
  ctx.scale(o.cell * lift, o.cell * lift); ctx.translate(0, bobY)

  if (o.foam !== false) {
    ctx.save(); ctx.lineJoin = 'round'
    ctx.strokeStyle = 'rgba(230,250,255,' + (0.22 + 0.1 * Math.sin(o.t * 2 + phase)) + ')'
    ctx.lineWidth = 0.1
    hullPath(ctx, x0, x1, spec.hw + 0.02, spec.bow, round); ctx.stroke()
    ctx.restore()
  }
  if (!sunk && o.foam !== false) {
    const g = ctx.createLinearGradient(x0, 0, x0 - 0.5, 0)
    g.addColorStop(0, 'rgba(235,252,255,.32)'); g.addColorStop(1, 'rgba(235,252,255,0)')
    ctx.fillStyle = g
    ctx.beginPath()
    ctx.moveTo(x0 + 0.05, -spec.hw * 0.6)
    ctx.lineTo(x0 - 0.5, -spec.hw * 0.95 - 0.04 * Math.sin(o.t * 2 + phase))
    ctx.lineTo(x0 - 0.5, spec.hw * 0.95 + 0.04 * Math.sin(o.t * 2.3 + phase))
    ctx.lineTo(x0 + 0.05, spec.hw * 0.6)
    ctx.closePath(); ctx.fill()
  }

  const grad = ctx.createLinearGradient(0, -spec.hw, 0, spec.hw)
  grad.addColorStop(0, spec.edge); grad.addColorStop(0.5, spec.mid); grad.addColorStop(1, spec.edge)
  ctx.fillStyle = grad; ctx.strokeStyle = spec.line; ctx.lineWidth = 0.03; ctx.lineJoin = 'round'
  hullPath(ctx, x0, x1, spec.hw, spec.bow, round); ctx.fill(); ctx.stroke()

  ctx.fillStyle = spec.deck; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 0.015
  hullPath(ctx, x0 + 0.07, x1 - 0.1, spec.hw * (o.id === 'carrier' ? 0.9 : 0.72), spec.bow * 0.85, round)
  ctx.fill(); ctx.stroke()

  shipDetails(ctx, o.id, L, spec, x0, x1)

  if (round) {
    ctx.fillStyle = 'rgba(20,120,150,.22)'
    hullPath(ctx, x0, x1, spec.hw, spec.bow, true); ctx.fill()
  }
  if (o.tint === 'valid') {
    ctx.fillStyle = 'rgba(70,240,150,.32)'; hullPath(ctx, x0, x1, spec.hw, spec.bow, round); ctx.fill()
  } else if (o.tint === 'invalid') {
    ctx.fillStyle = 'rgba(255,70,70,.42)'; hullPath(ctx, x0, x1, spec.hw, spec.bow, round); ctx.fill()
  } else if (sunk) {
    ctx.fillStyle = 'rgba(14,8,4,.62)'; hullPath(ctx, x0, x1, spec.hw, spec.bow, round); ctx.fill()
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 0.03
    ctx.beginPath()
    ctx.moveTo(x0 + L * 0.3, -spec.hw); ctx.lineTo(x0 + L * 0.34, 0.05); ctx.lineTo(x0 + L * 0.28, spec.hw)
    ctx.moveTo(x0 + L * 0.68, -spec.hw); ctx.lineTo(x0 + L * 0.64, -0.04); ctx.lineTo(x0 + L * 0.7, spec.hw)
    ctx.stroke()
  }
  ctx.restore()
}

function drawShipIcon(canvas, id, length, cell, sunk) {
  const w = Math.round(cell * (length + 0.4))
  const h = Math.round(cell * 1.05)
  const dpr = Math.min(2, window.devicePixelRatio || 1)
  canvas.width = w * dpr; canvas.height = h * dpr
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px'
  const ctx = canvas.getContext('2d')
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  ctx.clearRect(0, 0, w, h)
  drawShip(ctx, { id, length, x: cell * 0.7, y: h / 2, angle: 0, cell, t: 0, foam: false, tint: sunk ? 'sunk' : null })
}

/* =========================================================================
   Particles
   ========================================================================= */
const rnd = (a, b) => a + Math.random() * (b - a)
class Fx {
  constructor() { this.ps = [] }
  add(p) { if (this.ps.length >= 700) this.ps.shift(); this.ps.push(p) }
  P(kind, x, y, o) { this.add(Object.assign({ kind, x, y, vx: 0, vy: 0, z: 0, vz: 0, life: 0, max: 1, size: 0.1, grow: 0 }, o)) }
  explosion(x, y, big) {
    this.P('flash', x, y, { max: 0.35, size: big ? 1.5 : 1.1 })
    this.P('ring', x, y, { max: 0.7, size: 0.15, grow: big ? 3.4 : 2.6 })
    const fire = big ? 26 : 18
    for (let i = 0; i < fire; i++) {
      const a = Math.random() * Math.PI * 2, s = rnd(0.4, big ? 2.6 : 2.0)
      this.P('fire', x, y, { vx: Math.cos(a) * s, vy: Math.sin(a) * s, max: rnd(0.35, 0.8), size: rnd(0.12, 0.26), grow: 0.2 })
    }
    for (let i = 0; i < (big ? 22 : 14); i++) {
      const a = Math.random() * Math.PI * 2, s = rnd(1.5, 4.5)
      this.P('spark', x, y, { vx: Math.cos(a) * s, vy: Math.sin(a) * s, max: rnd(0.3, 0.7), size: rnd(0.04, 0.09) })
    }
    for (let i = 0; i < (big ? 12 : 7); i++) this.smoke(x + rnd(-0.2, 0.2), y + rnd(-0.2, 0.2), 0.6)
  }
  splash(x, y) {
    this.P('ring', x, y, { max: 0.9, size: 0.1, grow: 2.2 })
    this.P('ring', x, y, { life: -0.12, max: 0.9, size: 0.1, grow: 1.5 })
    for (let i = 0; i < 22; i++) {
      const a = Math.random() * Math.PI * 2, s = rnd(0.2, 1.4)
      this.P('drop', x, y, { vx: Math.cos(a) * s, vy: Math.sin(a) * s, vz: rnd(1.6, 3.6), max: 1.2, size: rnd(0.035, 0.075) })
    }
  }
  flame(x, y) {
    this.P('fire', x + rnd(-0.22, 0.22), y + rnd(-0.22, 0.22), { vx: rnd(-0.12, 0.12), vy: rnd(-0.5, -0.15), max: rnd(0.4, 0.8), size: rnd(0.07, 0.15), grow: -0.05 })
  }
  smoke(x, y, dark) {
    this.P('smoke', x, y, { vx: rnd(0.05, 0.4), vy: rnd(-0.55, -0.15), max: rnd(1.4, 2.6), size: rnd(0.1, 0.18), grow: rnd(0.15, 0.3), dark: dark == null ? 0.4 : dark })
  }
  trail(x, y) {
    this.P('smoke', x + rnd(-0.03, 0.03), y + rnd(-0.03, 0.03), { max: 0.7, size: 0.06, grow: 0.12, dark: 0.9 })
  }
  update(dt) {
    for (const p of this.ps) {
      p.life += dt
      if (p.life < 0) continue
      p.x += p.vx * dt; p.y += p.vy * dt
      if (p.kind === 'drop') {
        p.z += p.vz * dt; p.vz -= 9 * dt
        p.vx *= 1 - dt * 0.8; p.vy *= 1 - dt * 0.8
        if (p.z <= 0 && p.life > 0.08) p.life = p.max
      } else if (p.kind === 'spark') {
        p.vx *= 1 - dt * 2.2; p.vy *= 1 - dt * 2.2
      } else if (p.kind === 'fire') {
        p.vx *= 1 - dt * 1.6; p.vy *= 1 - dt * 1.6
      }
      p.size = Math.max(0, p.size + p.grow * dt)
    }
    this.ps = this.ps.filter((p) => p.life < p.max)
  }
  draw(ctx, ox, oy, cell) {
    for (const p of this.ps) {
      if (p.life < 0) continue
      const f = p.life / p.max
      const X = (p.x + ox) * cell, Y = (p.y + oy) * cell
      if (p.kind === 'smoke') {
        const shade = Math.round(20 + (1 - (p.dark == null ? 0.4 : p.dark)) * 90)
        ctx.fillStyle = 'rgba(' + shade + ',' + (shade + 4) + ',' + (shade + 8) + ',' + 0.32 * (1 - f) * Math.min(1, f * 6) + ')'
        ctx.beginPath(); ctx.arc(X, Y, p.size * cell, 0, Math.PI * 2); ctx.fill()
      } else if (p.kind === 'ring') {
        ctx.strokeStyle = 'rgba(235,252,255,' + 0.7 * (1 - f) + ')'
        ctx.lineWidth = Math.max(1, cell * 0.04 * (1 - f))
        ctx.beginPath(); ctx.arc(X, Y, p.size * cell, 0, Math.PI * 2); ctx.stroke()
      } else if (p.kind === 'drop') {
        const s = p.size * cell * (1 + p.z * 0.25)
        ctx.fillStyle = 'rgba(240,252,255,' + 0.85 * (1 - f * 0.5) + ')'
        ctx.beginPath(); ctx.arc(X, Y - p.z * cell * 0.35, s, 0, Math.PI * 2); ctx.fill()
      }
    }
    ctx.save()
    ctx.globalCompositeOperation = 'lighter'
    for (const p of this.ps) {
      if (p.life < 0) continue
      const f = p.life / p.max
      const X = (p.x + ox) * cell, Y = (p.y + oy) * cell
      if (p.kind === 'fire') {
        const g = Math.round(210 * (1 - f) + 40)
        ctx.fillStyle = 'rgba(255,' + g + ',' + Math.round(40 * (1 - f)) + ',' + 0.55 * (1 - f) + ')'
        ctx.beginPath(); ctx.arc(X, Y, Math.max(0.5, p.size * cell), 0, Math.PI * 2); ctx.fill()
      } else if (p.kind === 'spark') {
        ctx.strokeStyle = 'rgba(255,' + Math.round(220 - 120 * f) + ',90,' + (1 - f) + ')'
        ctx.lineWidth = Math.max(1, p.size * cell * 0.8); ctx.lineCap = 'round'
        ctx.beginPath(); ctx.moveTo(X, Y); ctx.lineTo(X - p.vx * cell * 0.05, Y - p.vy * cell * 0.05); ctx.stroke()
      } else if (p.kind === 'flash') {
        const r = p.size * cell * (0.4 + f * 0.9)
        const g = ctx.createRadialGradient(X, Y, 0, X, Y, r)
        g.addColorStop(0, 'rgba(255,250,210,' + 0.95 * (1 - f) + ')')
        g.addColorStop(0.35, 'rgba(255,170,60,' + 0.6 * (1 - f) + ')')
        g.addColorStop(1, 'rgba(255,80,20,0)')
        ctx.fillStyle = g
        ctx.beginPath(); ctx.arc(X, Y, r, 0, Math.PI * 2); ctx.fill()
      }
    }
    ctx.restore()
  }
}

/* =========================================================================
   Board canvas (water, ships, fire, ghost, reticle, shells, radar)
   ========================================================================= */
const PAD = 0.8
const WORLD = SIZE + PAD * 2
const clamp01 = (v) => Math.max(0, Math.min(1, v))

function drawFinger(ctx, fx, fy, tx, ty, cell, t) {
  ctx.save()
  ctx.setLineDash([cell * 0.1, cell * 0.12])
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = Math.max(1.5, cell * 0.035)
  ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(tx, ty); ctx.stroke()
  ctx.setLineDash([])
  const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, cell * 0.9)
  g.addColorStop(0, 'rgba(255,255,255,.28)'); g.addColorStop(1, 'rgba(255,255,255,0)')
  ctx.fillStyle = g
  ctx.beginPath(); ctx.arc(fx, fy, cell * 0.9, 0, Math.PI * 2); ctx.fill()
  ctx.strokeStyle = 'rgba(255,255,255,.7)'
  ctx.beginPath(); ctx.arc(fx, fy, cell * (0.55 + 0.04 * Math.sin(t * 6)), 0, Math.PI * 2); ctx.stroke()
  ctx.restore()
}

class BoardView {
  constructor(wrap, canvas, kind, getProps) {
    this.wrap = wrap; this.canvas = canvas; this.kind = kind; this.getProps = getProps
    this.ctx = canvas.getContext('2d')
    this.water = new Water(116)
    this.fx = new Fx()
    this.ripples = []; this.shells = []; this.shake_ = 0
    this.last = performance.now() / 1000
    this.gh = { x: 0, y: 0, a: 0, active: false }
    this.onPointer = null
    new ResizeObserver(() => this.resize()).observe(wrap)
    this.resize()
    this.bindPointer()
    requestAnimationFrame((ms) => this.frame(ms))
  }
  resize() {
    const w = this.wrap.clientWidth
    if (w < 2) return
    const dpr = Math.min(2, window.devicePixelRatio || 1)
    const px = Math.round(w * dpr)
    if (this.canvas.width !== px) { this.canvas.width = px; this.canvas.height = px }
  }
  now() { return performance.now() / 1000 }
  toCell(clientX, clientY) {
    const rect = this.canvas.getBoundingClientRect()
    if (!rect || rect.width === 0) return { fr: -99, fc: -99 }
    return { fc: ((clientX - rect.left) / rect.width) * WORLD - PAD, fr: ((clientY - rect.top) / rect.height) * WORLD - PAD }
  }
  launch(r, c, durMs, from, onLand) {
    sfx.launch()
    this.shells.push({ r, c, from, t0: this.now(), dur: durMs / 1000, onLand, lastTrail: 0 })
  }
  ripple(r, c, strength) {
    this.ripples.push({ x: c + 0.5 + PAD, y: r + 0.5 + PAD, t0: this.now(), strength: strength == null ? 0.9 : strength })
  }
  impact(r, c, result, ship) {
    const x = c + 0.5, y = r + 0.5, t = this.now()
    if (result === 'miss') {
      this.fx.splash(x, y)
      this.ripples.push({ x: x + PAD, y: y + PAD, t0: t, strength: 1.2 })
      this.shake_ = Math.max(this.shake_, 2)
      sfx.splash()
    } else if (result === 'hit') {
      this.fx.explosion(x, y, false)
      this.ripples.push({ x: x + PAD, y: y + PAD, t0: t, strength: 1.1 })
      this.shake_ = Math.max(this.shake_, 8)
      sfx.boom()
    } else {
      const cells = ship ? shipCells(ship) : [{ r, c }]
      cells.forEach((cl, i) => {
        setTimeout(() => {
          this.fx.explosion(cl.c + 0.5, cl.r + 0.5, true)
          this.ripples.push({ x: cl.c + 0.5 + PAD, y: cl.r + 0.5 + PAD, t0: this.now(), strength: 1.3 })
          this.shake_ = Math.max(this.shake_, 12)
        }, i * 110)
      })
      sfx.sunk()
    }
  }
  bindPointer() {
    const cv = this.canvas
    const emit = (e, phase) => {
      if (!this.onPointer) return
      const rect = cv.getBoundingClientRect()
      this.onPointer({
        phase,
        fc: ((e.clientX - rect.left) / rect.width) * WORLD - PAD,
        fr: ((e.clientY - rect.top) / rect.height) * WORLD - PAD,
        clientX: e.clientX, clientY: e.clientY, pointerType: e.pointerType, button: e.button,
      })
    }
    const live = () => this.getProps().interactive
    cv.addEventListener('pointerdown', (e) => { if (!live()) return; cv.setPointerCapture(e.pointerId); emit(e, 'down') })
    cv.addEventListener('pointermove', (e) => { if (live()) emit(e, 'move') })
    cv.addEventListener('pointerup', (e) => {
      if (!live()) return
      if (cv.hasPointerCapture(e.pointerId)) cv.releasePointerCapture(e.pointerId)
      emit(e, 'up')
    })
    cv.addEventListener('pointercancel', (e) => { if (live()) emit(e, 'cancel') })
    cv.addEventListener('pointerleave', (e) => { if (live()) emit(e, 'leave') })
    cv.addEventListener('contextmenu', (e) => e.preventDefault())
  }

  frame(nowMs) {
    requestAnimationFrame((ms) => this.frame(ms))
    if (this.wrap.clientWidth < 2) { this.last = nowMs / 1000; return }
    const t = nowMs / 1000
    const dt = Math.min(0.05, Math.max(0.001, t - this.last))
    this.last = t
    const canvas = this.canvas, ctx = this.ctx, kind = this.kind
    const W = canvas.width
    if (W < 2) return
    const cell = W / WORLD
    const p = this.getProps()
    const toPx = (v) => (v + PAD) * cell
    canvas.style.touchAction = p.interactive ? 'none' : 'auto'
    canvas.style.cursor = p.interactive ? p.cursor : 'default'

    ctx.setTransform(1, 0, 0, 1, 0, 0)
    ctx.clearRect(0, 0, W, W)
    this.ripples = this.ripples.filter((r) => t - r.t0 < 3.3)
    this.water.draw(ctx, W, W, WORLD, WORLD, t, this.ripples)

    // frame
    ctx.fillStyle = 'rgba(2,16,26,.42)'
    const pp = PAD * cell
    ctx.fillRect(0, 0, W, pp); ctx.fillRect(0, W - pp, W, pp)
    ctx.fillRect(0, pp, pp, W - pp * 2); ctx.fillRect(W - pp, pp, pp, W - pp * 2)

    // grid
    ctx.strokeStyle = 'rgba(205,240,255,.14)'
    ctx.lineWidth = Math.max(1, cell * 0.015)
    ctx.beginPath()
    for (let i = 0; i <= SIZE; i++) {
      ctx.moveTo(toPx(i), toPx(0)); ctx.lineTo(toPx(i), toPx(SIZE))
      ctx.moveTo(toPx(0), toPx(i)); ctx.lineTo(toPx(SIZE), toPx(i))
    }
    ctx.stroke()
    ctx.strokeStyle = 'rgba(225,250,255,.45)'
    ctx.lineWidth = Math.max(1.5, cell * 0.03)
    ctx.strokeRect(toPx(0), toPx(0), SIZE * cell, SIZE * cell)
    ctx.fillStyle = 'rgba(225,246,255,.78)'
    ctx.font = '600 ' + Math.round(cell * 0.36) + 'px ui-monospace, SFMono-Regular, Menlo, monospace'
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
    for (let i = 0; i < SIZE; i++) {
      ctx.fillText(LETTERS[i], toPx(i + 0.5), toPx(0) - pp * 0.5)
      ctx.fillText(String(i + 1), toPx(0) - pp * 0.5, toPx(i + 0.5))
    }

    const board = p.board
    const ships = board.ships
    const visible = kind === 'own' ? ships : ships.filter((s) => s.sunk)

    // oil slicks
    for (const s of ships) {
      if (!s.sunk) continue
      const cx = toPx(s.c + (s.horizontal ? s.length / 2 : 0.5))
      const cy = toPx(s.r + (s.horizontal ? 0.5 : s.length / 2))
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(s.horizontal ? 0 : Math.PI / 2)
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, s.length * cell * 0.7)
      g.addColorStop(0, 'rgba(4,8,10,.55)'); g.addColorStop(1, 'rgba(4,8,10,0)')
      ctx.fillStyle = g; ctx.scale(1, 0.55)
      ctx.beginPath(); ctx.arc(0, 0, s.length * cell * 0.7, 0, Math.PI * 2); ctx.fill()
      ctx.restore()
    }
    for (const s of visible) {
      drawShip(ctx, {
        id: s.id, length: s.length, x: toPx(s.c + 0.5), y: toPx(s.r + 0.5),
        angle: s.horizontal ? 0 : Math.PI / 2, cell, t,
        tint: s.sunk ? 'sunk' : null, bob: !s.sunk, foam: !s.sunk,
      })
    }

    // shot markers + persistent fires
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const st = board.shots[r][c]
        if (!st) continue
        const cx = toPx(c + 0.5), cy = toPx(r + 0.5)
        if (st === 'miss') {
          const pulse = 0.5 + 0.5 * Math.sin(t * 2.2 + r * 1.3 + c)
          ctx.strokeStyle = 'rgba(235,252,255,' + (0.4 + pulse * 0.2) + ')'
          ctx.lineWidth = Math.max(1.5, cell * 0.04)
          ctx.beginPath(); ctx.arc(cx, cy, cell * (0.2 + pulse * 0.04), 0, Math.PI * 2); ctx.stroke()
          ctx.fillStyle = 'rgba(235,252,255,.6)'
          ctx.beginPath(); ctx.arc(cx, cy, cell * 0.05, 0, Math.PI * 2); ctx.fill()
        } else {
          const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, cell * 0.5)
          g.addColorStop(0, 'rgba(0,0,0,.55)'); g.addColorStop(1, 'rgba(0,0,0,0)')
          ctx.fillStyle = g
          ctx.beginPath(); ctx.arc(cx, cy, cell * 0.5, 0, Math.PI * 2); ctx.fill()
          if (st === 'hit') {
            const k = cell * 0.13
            ctx.strokeStyle = 'rgba(255,90,70,.95)'; ctx.lineWidth = Math.max(2, cell * 0.06); ctx.lineCap = 'round'
            ctx.beginPath()
            ctx.moveTo(cx - k, cy - k); ctx.lineTo(cx + k, cy + k)
            ctx.moveTo(cx + k, cy - k); ctx.lineTo(cx - k, cy + k)
            ctx.stroke()
            if (Math.random() < dt * 16) this.fx.flame(c + 0.5, r + 0.5)
            if (Math.random() < dt * 2.5) this.fx.smoke(c + 0.5, r + 0.5, 0.35)
          } else {
            if (Math.random() < dt * 4) this.fx.flame(c + 0.5, r + 0.5)
            if (Math.random() < dt * 2.2) this.fx.smoke(c + 0.5, r + 0.5, 0.8)
          }
        }
      }
    }

    // placement ghost
    const gh = p.ghost, G = this.gh
    if (gh) {
      const tx = gh.c + 0.5, ty = gh.r + 0.5, ta = gh.horizontal ? 0 : Math.PI / 2
      if (!G.active) { G.x = tx; G.y = ty; G.a = ta; G.active = true }
      else {
        const k = 1 - Math.exp(-dt * 24)
        G.x += (tx - G.x) * k; G.y += (ty - G.y) * k
        G.a += (ta - G.a) * (1 - Math.exp(-dt * 20))
      }
      const col = gh.valid ? '90,240,160' : '255,90,90'
      for (let i = 0; i < gh.length; i++) {
        const cr = gh.horizontal ? gh.r : gh.r + i
        const cc = gh.horizontal ? gh.c + i : gh.c
        ctx.fillStyle = 'rgba(' + col + ',.2)'
        ctx.fillRect(toPx(cc) + 1, toPx(cr) + 1, cell - 2, cell - 2)
        ctx.strokeStyle = 'rgba(' + col + ',.85)'; ctx.lineWidth = Math.max(1.5, cell * 0.03)
        ctx.strokeRect(toPx(cc) + 2, toPx(cr) + 2, cell - 4, cell - 4)
      }
      drawShip(ctx, {
        id: gh.id, length: gh.length, x: toPx(G.x), y: toPx(G.y), angle: G.a, cell, t,
        alpha: 0.95, tint: gh.valid ? 'valid' : 'invalid', lifted: gh.lifted, bob: true,
      })
      if (gh.finger) {
        const hx = toPx(gh.c + (gh.horizontal ? gh.length / 2 : 0.5))
        const hy = toPx(gh.r + (gh.horizontal ? 0.5 : gh.length / 2))
        drawFinger(ctx, toPx(gh.finger.fc), toPx(gh.finger.fr), hx, hy, cell, t)
      }
    } else G.active = false

    // particles
    this.fx.update(dt)
    this.fx.draw(ctx, PAD, PAD, cell)

    // shells in flight
    for (const s of this.shells) {
      const prog = clamp01((t - s.t0) / s.dur)
      const tx = s.c + 0.5, ty = s.r + 0.5
      const sx = SIZE / 2 + (tx - SIZE / 2) * 0.35
      const sy = s.from === 'top' ? -2.8 : SIZE + 2.8
      const gx = sx + (tx - sx) * prog, gy = sy + (ty - sy) * prog
      const alt = Math.sin(Math.PI * prog)
      const hx = gx, hy = gy - alt * 2.6
      ctx.strokeStyle = 'rgba(255,110,80,' + (0.35 + 0.5 * prog) + ')'
      ctx.lineWidth = Math.max(1.5, cell * 0.04)
      ctx.beginPath(); ctx.arc(toPx(tx), toPx(ty), cell * (0.75 - 0.4 * prog), 0, Math.PI * 2); ctx.stroke()
      ctx.fillStyle = 'rgba(0,10,16,.35)'
      ctx.beginPath(); ctx.ellipse(toPx(gx), toPx(gy), cell * 0.13, cell * 0.09, 0, 0, Math.PI * 2); ctx.fill()
      const sc = 0.65 + alt * 0.7
      const gg = ctx.createRadialGradient(toPx(hx), toPx(hy), 0, toPx(hx), toPx(hy), cell * 0.32 * sc)
      gg.addColorStop(0, 'rgba(255,240,190,.95)'); gg.addColorStop(0.4, 'rgba(255,170,70,.45)'); gg.addColorStop(1, 'rgba(255,120,40,0)')
      ctx.fillStyle = gg
      ctx.beginPath(); ctx.arc(toPx(hx), toPx(hy), cell * 0.32 * sc, 0, Math.PI * 2); ctx.fill()
      ctx.fillStyle = '#fff6d6'
      ctx.beginPath(); ctx.arc(toPx(hx), toPx(hy), cell * 0.07 * sc, 0, Math.PI * 2); ctx.fill()
      if (t - s.lastTrail > 0.016) { this.fx.trail(hx, hy); s.lastTrail = t }
    }
    const landed = this.shells.filter((s) => t - s.t0 >= s.dur)
    if (landed.length) {
      this.shells = this.shells.filter((s) => t - s.t0 < s.dur)
      landed.forEach((s) => s.onLand())
    }

    // targeting reticle
    const rt = p.reticle
    if (rt) {
      const cx = toPx(rt.c + 0.5), cy = toPx(rt.r + 0.5)
      const base = rt.valid ? '255,214,102' : '150,170,180'
      ctx.fillStyle = rt.valid ? 'rgba(255,80,60,.16)' : 'rgba(150,170,180,.18)'
      ctx.fillRect(toPx(rt.c), toPx(rt.r), cell, cell)
      ctx.strokeStyle = 'rgba(' + base + ',.22)'; ctx.lineWidth = Math.max(1, cell * 0.02)
      ctx.beginPath()
      ctx.moveTo(toPx(0), cy); ctx.lineTo(toPx(SIZE), cy)
      ctx.moveTo(cx, toPx(0)); ctx.lineTo(cx, toPx(SIZE))
      ctx.stroke()
      const bl = cell * 0.26
      const x0 = toPx(rt.c) + 2, y0 = toPx(rt.r) + 2, x1 = toPx(rt.c + 1) - 2, y1 = toPx(rt.r + 1) - 2
      ctx.strokeStyle = 'rgba(' + base + ',.95)'; ctx.lineWidth = Math.max(2, cell * 0.05); ctx.lineCap = 'round'
      ctx.beginPath()
      ctx.moveTo(x0, y0 + bl); ctx.lineTo(x0, y0); ctx.lineTo(x0 + bl, y0)
      ctx.moveTo(x1 - bl, y0); ctx.lineTo(x1, y0); ctx.lineTo(x1, y0 + bl)
      ctx.moveTo(x1, y1 - bl); ctx.lineTo(x1, y1); ctx.lineTo(x1 - bl, y1)
      ctx.moveTo(x0 + bl, y1); ctx.lineTo(x0, y1); ctx.lineTo(x0, y1 - bl)
      ctx.stroke()
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * 1.4)
      ctx.setLineDash([cell * 0.12, cell * 0.09]); ctx.lineWidth = Math.max(1.5, cell * 0.035)
      ctx.beginPath(); ctx.arc(0, 0, cell * 0.36, 0, Math.PI * 2); ctx.stroke()
      ctx.restore()
      ctx.beginPath()
      for (const d of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        ctx.moveTo(cx + d[0] * cell * 0.12, cy + d[1] * cell * 0.12)
        ctx.lineTo(cx + d[0] * cell * 0.3, cy + d[1] * cell * 0.3)
      }
      ctx.stroke()
      ctx.fillStyle = 'rgba(' + base + ',1)'
      ctx.beginPath(); ctx.arc(cx, cy, cell * 0.035, 0, Math.PI * 2); ctx.fill()
      if (rt.finger) drawFinger(ctx, toPx(rt.finger.fc), toPx(rt.finger.fr), cx, cy, cell, t)
    }

    // radar sweep
    if (p.radar && typeof ctx.createConicGradient === 'function') {
      const cxr = toPx(SIZE / 2)
      const g = ctx.createConicGradient(t * 0.9, cxr, cxr)
      g.addColorStop(0, 'rgba(110,255,190,.2)'); g.addColorStop(0.14, 'rgba(110,255,190,0)'); g.addColorStop(1, 'rgba(110,255,190,0)')
      ctx.save()
      ctx.beginPath(); ctx.rect(toPx(0), toPx(0), SIZE * cell, SIZE * cell); ctx.clip()
      ctx.fillStyle = g; ctx.fillRect(toPx(0), toPx(0), SIZE * cell, SIZE * cell)
      ctx.restore()
    }

    // vignette
    const vg = ctx.createRadialGradient(W / 2, W / 2, W * 0.35, W / 2, W / 2, W * 0.75)
    vg.addColorStop(0, 'rgba(0,10,18,0)'); vg.addColorStop(1, 'rgba(0,10,18,.5)')
    ctx.fillStyle = vg
    ctx.fillRect(0, 0, W, W)

    // screen shake
    if (this.shake_ > 0.1) {
      const m = this.shake_
      canvas.style.transform = 'translate(' + ((Math.random() - 0.5) * m).toFixed(1) + 'px,' + ((Math.random() - 0.5) * m).toFixed(1) + 'px)'
      this.shake_ *= Math.exp(-dt * 8)
    } else if (this.shake_ !== 0) {
      this.shake_ = 0
      canvas.style.transform = ''
    }
  }
}

/* =========================================================================
   Menu backdrop: ships cruising over live water
   ========================================================================= */
function startBackdrop() {
  const canvas = $('backdrop')
  const ctx = canvas.getContext('2d')
  const water = new Water(130)
  const lanes = FLEET.map((f, i) => ({
    id: f.id, length: f.length,
    y: 0.12 + (i / FLEET.length) * 0.82 + (i % 2) * 0.03,
    speed: (i % 2 ? -1 : 1) * (0.35 + i * 0.07),
    offset: i * 7.3,
  }))
  const resize = () => {
    const dpr = Math.min(1.5, window.devicePixelRatio || 1)
    canvas.width = Math.round(window.innerWidth * dpr)
    canvas.height = Math.round(window.innerHeight * dpr)
  }
  resize()
  window.addEventListener('resize', resize)
  const frame = (ms) => {
    requestAnimationFrame(frame)
    if ($('menu').hidden) return
    const t = ms / 1000
    const W = canvas.width, H = canvas.height
    const cell = (44 * W) / window.innerWidth
    const worldW = W / cell, worldH = H / cell
    ctx.setTransform(1, 0, 0, 1, 0, 0)
    water.draw(ctx, W, H, worldW, worldH, t, [])
    const span = worldW + 14
    for (const s of lanes) {
      const dir = s.speed > 0 ? 1 : -1
      const travel = (t * Math.abs(s.speed) + s.offset) % span
      const x = dir > 0 ? travel - 7 : worldW + 7 - travel
      ctx.globalAlpha = 0.9
      drawShip(ctx, { id: s.id, length: s.length, x: x * cell, y: s.y * H, angle: dir > 0 ? 0 : Math.PI, cell, t, bob: true })
      ctx.globalAlpha = 1
    }
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.2, W / 2, H / 2, Math.max(W, H) * 0.75)
    g.addColorStop(0, 'rgba(2,12,20,.35)'); g.addColorStop(1, 'rgba(2,12,20,.9)')
    ctx.fillStyle = g
    ctx.fillRect(0, 0, W, H)
  }
  requestAnimationFrame(frame)
}

function later(fn, ms) {
  const run = runId

/* ---- render ---- */
let pipKey = '', quizEl = null, resultEl = null
function render() {
  const menu = G.phase === 'menu'
  $('menu').hidden = !menu
  $('game').hidden = menu
  if (menu) { closeModals(); return }

  const game = $('game')
  game.dataset.phase = G.phase
  game.dataset.view = G.view

  $('levelBadge').textContent = (LEVELS.find((l) => l.id === G.level) || {}).name || ''
  const slots = Math.max(AMMO_START, G.ammo)
  const key = slots + ':' + G.ammo
  if (key !== pipKey) {
    pipKey = key
    $('pips').innerHTML = Array.from({ length: slots }, (_, i) => '<span class="pip' + (i < G.ammo ? ' on' : '') + '"></span>').join('')
  }
  $('ammoNum').textContent = G.ammo
  $('ammo').setAttribute('aria-label', 'Ammo: ' + G.ammo + ' shells')

  const inPlacement = G.phase === 'placement'
  const myTurn = G.phase === 'combat' && G.turn === 'player' && !G.busy && !G.quiz
  const hud = $('hud')
  hud.textContent = G.hud
  hud.className = myTurn ? 'mine' : G.turn === 'enemy' && G.phase === 'combat' ? 'theirs' : ''
  $('reloadBtn').hidden = !(G.phase === 'combat' && G.ammo <= 0 && !G.quiz && myTurn)

  document.querySelectorAll('#tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.view === G.view)))

  $('muteBtn').innerHTML = icon(G.muted ? 'mute' : 'vol')
  $('muteBtn').setAttribute('aria-label', G.muted ? 'Unmute sound' : 'Mute sound')

  // panels
  ownP.cap.textContent = inPlacement ? G.player.ships.length + '/' + FLEET.length + ' deployed' : 'Top-down view'
  ownP.dot.classList.toggle('on', G.turn === 'enemy' && G.phase === 'combat')
  ownP.list.hidden = inPlacement
  enemyP.cap.textContent = myTurn ? 'Release to fire' : 'Radar active'
  enemyP.dot.classList.toggle('on', myTurn)
  syncFleet(ownP, G.player)
  syncFleet(enemyP, G.enemy)
  syncBanner(ownP, G.banners.own)
  syncBanner(enemyP, G.banners.enemy)

  // placement bar
  if (inPlacement) {
    const placedCount = G.player.ships.length
    FLEET.forEach((def) => {
      const placed = G.player.ships.some((s) => s.id === def.id)
      const t = trayBtns[def.id]
      t.b.disabled = placed
      t.b.classList.toggle('sel', G.sel === def.id && !placed)
      t.b.setAttribute('aria-pressed', String(G.sel === def.id && !placed))
      t.small.textContent = placed ? 'Deployed' : def.length + ' cells'
    })
    $('clearBtn').disabled = placedCount === 0
    const ready = placedCount === FLEET.length
    $('readyBtn').disabled = !ready
    $('readyBtn').textContent = ready ? 'Open fire' : placedCount + '/' + FLEET.length + ' placed'
    $('rotateBtn').setAttribute('aria-label', 'Rotate, currently ' + (G.horizontal ? 'horizontal' : 'vertical'))
  }

  // modals
  if (G.quiz && !quizEl) showQuiz()
  if (!G.quiz && quizEl) { quizEl.remove(); quizEl = null }
  if (G.phase === 'result' && !resultEl) showResult()
  if (G.phase !== 'result' && resultEl) { resultEl.remove(); resultEl = null }
}
function closeModals() {
  if (quizEl) { quizEl.remove(); quizEl = null }
  if (resultEl) { resultEl.remove(); resultEl = null }
}
function syncFleet(panel, board) {
  FLEET.forEach((def) => {
    const ship = board.ships.find((s) => s.id === def.id)
    const sunk = !!(ship && ship.sunk)
    const ic = panel.icons[def.id]
    if (ic.sunk !== sunk) {
      ic.sunk = sunk
      ic.li.classList.toggle('sunk', sunk)
      drawShipIcon(ic.cv, def.id, def.length, 9, sunk)
    }
  })
}
function syncBanner(panel, banner) {
  const id = banner ? banner.id : 0
  if (id === panel.bannerId) return
  panel.bannerId = id
  panel.layer.innerHTML = ''
  if (banner) {
    const s = document.createElement('span')
    s.className = 'banner ' + banner.tone
    s.textContent = banner.text
    panel.layer.appendChild(s)
  }
}

/* ---- quiz + result modals ---- */
function showQuiz() {
  const q = G.quiz.q
  const ov = document.createElement('div')
  ov.className = 'overlay'
  ov.innerHTML =
    '<div class="modal quiz" role="dialog" aria-modal="true" aria-labelledby="quiz-title">' +
    '<p class="eyebrow">Out of ammo \u00b7 Reload</p><h2 id="quiz-title"></h2>' +
    '<p class="meta">Correct: +' + AMMO_PER_CORRECT + ' shells \u00b7 Wrong: +' + AMMO_PER_WRONG + '</p>' +
    '<div class="opts"></div><p class="qmsg" aria-live="polite"></p></div>'
  ov.querySelector('h2').textContent = q.question
  const opts = ov.querySelector('.opts'), msg = ov.querySelector('.qmsg')
  const btns = q.options.map((text, i) => {
    const b = document.createElement('button')
    b.type = 'button'; b.className = 'opt'
    const sp = document.createElement('span'); sp.textContent = text
    const mark = document.createElement('span')
    b.append(sp, mark)
    b.addEventListener('click', () => {
      if (btns.some((x) => x.disabled)) return
      btns.forEach((x) => (x.disabled = true))
      const ok = i === q.correct
      if (ok) sfx.correct(); else sfx.wrong()
      btns[q.correct].classList.add('right'); btns[q.correct].lastChild.innerHTML = icon('ok')
      if (!ok) { b.classList.add('wrong'); mark.innerHTML = icon('bad') }
      msg.textContent = ok ? 'Locked and loaded \u2014 +' + AMMO_PER_CORRECT + ' shells!' : 'Not quite \u2014 +' + AMMO_PER_WRONG + ' shell.'
      setTimeout(() => resolveQuiz(ok), 1500)
    })
    opts.appendChild(b)
    return b
  })
  $('modalRoot').appendChild(ov)
  quizEl = ov
  btns[0].focus()
}
function showResult() {
  const acc = G.shots ? Math.round((G.hits / G.shots) * 100) : 0
  const ov = document.createElement('div')
  ov.className = 'overlay'
  ov.innerHTML =
    '<div class="modal result" role="dialog" aria-modal="true" aria-labelledby="result-title">' +
    '<p class="eyebrow ' + (G.won ? 'win' : 'lose') + '">' + (G.won ? 'Mission complete' : 'Mission failed') + '</p>' +
    '<h2 id="result-title">' + (G.won ? 'Victory!' : 'Defeat') + '</h2>' +
    '<p class="m">' + (G.won ? 'You sank the enemy fleet.' : 'Your fleet has been destroyed.') + '</p>' +
    '<dl class="stats"><div><dt>Shots</dt><dd>' + G.shots + '</dd></div><div><dt>Hits</dt><dd>' + G.hits + '</dd></div><div><dt>Accuracy</dt><dd>' + acc + '%</dd></div></dl>' +
    '<div class="rbtns"><button type="button" class="gold" id="again">Play again</button><button type="button" class="out" id="tomenu">Change level</button></div></div>'
  ov.querySelector('#again').addEventListener('click', () => startPlacement())
  ov.querySelector('#tomenu').addEventListener('click', toMenu)
  $('modalRoot').appendChild(ov)
  resultEl = ov
  ov.querySelector('#again').focus()
}

/* ---- lifecycle ---- */
function flash(side, text, tone) {
  const id = ++bannerSeq
  set({ banners: { ...G.banners, [side]: { id, text, tone } } })
  later(() => {
    if (G.banners[side] && G.banners[side].id === id) set({ banners: { ...G.banners, [side]: null } })
  }, 1500)
}
function startPlacement(level) {
  resetTimers()
  drag = null; aimDown = false
  aiMem = createAiMemory(); answers = []
  quizIdx = Math.floor(Math.random() * questions.length)
  sfx.unlock()
  set({
    phase: 'placement', level: level || G.level, player: createBoard(), enemy: createBoard(),
    sel: 'carrier', horizontal: true, ghost: null, reticle: null, turn: 'player', busy: false,
    ammo: AMMO_START, quiz: null, hud: 'Deploy your fleet', banners: { own: null, enemy: null },
    view: 'own', won: false, shots: 0, hits: 0,
  })
}
function toMenu() {
  resetTimers()
  set({ phase: 'menu', quiz: null, ghost: null, reticle: null })
}
function startCombat() {
  if (G.player.ships.length !== FLEET.length) return
  const ships = autoPlaceFleet()
  if (!ships) { set({ hud: 'Could not place enemy fleet \u2014 try again' }); return }
  sfx.ping()
  set({
    phase: 'combat', enemy: createBoard(ships), player: { ...G.player, shots: emptyShots() },
    turn: 'player', busy: false, sel: null, ghost: null, reticle: null, view: 'enemy',
    hud: 'Your turn \u2014 aim at enemy waters, release to fire',
  })
}
function endGame(won) {
  if (won) sfx.win(); else sfx.lose()
  set({ phase: 'result', won, busy: false, reticle: null })
  try {
    window.parent.postMessage({ type: 'gameEnd', game: 'battleship', quizId, won, score: won ? 100 : 0, answers }, '*')
  } catch (e) { /* not embedded */ }
}

/* ---- quiz flow ---- */
function openQuiz() {
  if (G.quiz || G.phase !== 'combat') return
  const idx = quizIdx % questions.length
  quizIdx++
  sfx.ping()
  set({ quiz: { q: questions[idx], idx }, reticle: null, hud: 'Out of ammo \u2014 answer to reload' })
}
function resolveQuiz(correct) {
  if (!G.quiz) return
  answers.push({ qIdx: G.quiz.idx, correct })
  const gain = correct ? AMMO_PER_CORRECT : AMMO_PER_WRONG
  set({ quiz: null, ammo: G.ammo + gain, hud: 'Reloaded +' + gain + (correct ? ' shells' : ' shell') + ' \u2014 your turn' })
}

/* ---- combat flow ---- */
function backToPlayer() {
  set({ turn: 'player', busy: false, view: 'enemy', hud: 'Your turn \u2014 aim at enemy waters, release to fire' })
  if (G.ammo <= 0) later(openQuiz, 600)
}
function resolveAiShot(cell) {
  const out = applyShot(G.player, cell.r, cell.c)
  if (!out) { backToPlayer(); return }
  ownView.impact(cell.r, cell.c, out.result, out.ship)
  aiMem = updateAiMemory(G.level, aiMem, out.board.shots, cell.r, cell.c, out.result)
  const at = coord(cell.r, cell.c)
  if (out.result === 'miss') { set({ player: out.board, hud: 'Enemy missed at ' + at }); flash('own', 'Missed', 'miss') }
  else if (out.result === 'hit') { set({ player: out.board, hud: 'Enemy hit your ' + out.ship.name + ' at ' + at + '!' }); flash('own', 'Hit!', 'hit') }
  else { set({ player: out.board, hud: 'Enemy sank your ' + out.ship.name + '!' }); flash('own', out.ship.name + ' lost', 'sunk') }
  if (fleetSunk(out.board.ships)) { later(() => endGame(false), 1900); return }
  later(backToPlayer, out.result === 'sunk' ? 1800 : 1200)
}
function enemyTurn() {
  const res = chooseAiShot(G.level, G.player.shots, aiMem)
  aiMem = res.mem
  const cell = res.cell
  if (!cell) { backToPlayer(); return }
  set({ hud: 'Enemy is targeting\u2026' })
  later(() => ownView.launch(cell.r, cell.c, 900, 'top', () => resolveAiShot(cell)), 700)
}
function resolvePlayerShot(r, c) {
  const out = applyShot(G.enemy, r, c)
  if (!out) { set({ busy: false }); return }
  enemyView.impact(r, c, out.result, out.ship)
  const at = coord(r, c)
  const hits = G.hits + (out.result === 'miss' ? 0 : 1)
  if (out.result === 'miss') { set({ enemy: out.board, hits, hud: 'Splash \u2014 nothing at ' + at }); flash('enemy', 'Miss', 'miss') }
  else if (out.result === 'hit') { set({ enemy: out.board, hits, hud: 'Direct hit at ' + at + '!' }); flash('enemy', 'Direct hit!', 'hit') }
  else { set({ enemy: out.board, hits, hud: 'You sank the enemy ' + out.ship.name + '!' }); flash('enemy', 'Sunk!', 'sunk') }
  if (fleetSunk(out.board.ships)) { later(() => endGame(true), 2000); return }
  later(() => { set({ turn: 'enemy', view: 'own' }); enemyTurn() }, out.result === 'sunk' ? 1900 : 1300)
}
function firePlayer(r, c) {
  if (G.phase !== 'combat' || G.turn !== 'player' || G.busy || G.quiz) return
  if (G.enemy.shots[r][c] !== null) return
  if (G.ammo <= 0) { openQuiz(); return }
  set({ ammo: G.ammo - 1, shots: G.shots + 1, busy: true, reticle: null, hud: 'Firing at ' + coord(r, c) + '\u2026' })
  enemyView.launch(r, c, 850, 'bottom', () => resolvePlayerShot(r, c))
}

/* ---- placement ---- */
function ghostFor(info, id, horizontal, lifted) {
  if (info.fr < -1.4 || info.fr > SIZE + 1.4 || info.fc < -1.4 || info.fc > SIZE + 1.4) return null
  const def = FLEET.find((f) => f.id === id)
  if (!def) return null
  const L = def.length
  const touch = info.pointerType === 'touch'
  const lift = touch ? TOUCH_LIFT + (horizontal ? 0 : L / 2 - 0.5) : 0
  const fr = info.fr - lift
  let r, c
  if (horizontal) {
    c = clamp(Math.round(info.fc - L / 2), 0, SIZE - L)
    r = clamp(Math.floor(fr), 0, SIZE - 1)
  } else {
    r = clamp(Math.round(fr - L / 2), 0, SIZE - L)
    c = clamp(Math.floor(info.fc), 0, SIZE - 1)
  }
  const valid = canPlace(G.player.ships, L, r, c, horizontal)
  return { id, length: L, r, c, horizontal, valid, lifted, finger: touch && lifted ? { fr: info.fr, fc: info.fc } : null }
}
const nextUnplaced = (ships) => { const f = FLEET.find((x) => !ships.some((s) => s.id === x.id)); return f ? f.id : null }
function commitPlayerShips(ships) { set({ player: { ...G.player, ships } }) }
function deploy(id, r, c, horizontal) {
  const def = FLEET.find((f) => f.id === id)
  if (!def) return
  const ships = placeShip(G.player.ships, def, r, c, horizontal)
  sfx.place()
  for (let i = 0; i < def.length; i++) ownView.ripple(horizontal ? r : r + i, horizontal ? c + i : c, 0.28)
  const next = nextUnplaced(ships)
  set({
    player: { ...G.player, ships }, sel: next, ghost: null, horizontal,
    hud: next ? 'Place your ' + FLEET.find((f) => f.id === next).name : 'Fleet ready \u2014 press Open fire',
  })
}
function refreshGhost(info) {
  const id = drag ? drag.id : G.sel
  if (!info || !id) { if (G.ghost) aim({ ghost: null }); return }
  const lifted = !!drag && (drag.moved || drag.touch || drag.origin !== null)
  aim({ ghost: ghostFor(info, id, G.horizontal, lifted) })
}
function rotate() {
  if (G.phase !== 'placement') return
  sfx.rotate()
  set({ horizontal: !G.horizontal })
  refreshGhost(lastPtr && (drag || G.ghost) ? lastPtr : null)
}
function handlePlacementPointer(info) {
  if (G.phase !== 'placement') return
  const touch = info.pointerType === 'touch'
  if (info.phase === 'leave') { if (!drag && G.ghost) aim({ ghost: null }); return }
  if (info.phase === 'cancel') {
    const d = drag
    drag = null
    if (d && d.origin) commitPlayerShips(G.player.ships.concat([d.origin]))
    aim({ ghost: null })
    return
  }
  lastPtr = info

  if (info.phase === 'down') {
    if (info.button === 2) { rotate(); return }
    sfx.unlock()
    const cr = Math.floor(info.fr), cc = Math.floor(info.fc)
    const under = inBounds(cr, cc) ? shipAt(G.player.ships, cr, cc) : undefined
    let id = G.sel, origin = null
    if (under) {
      origin = under; id = under.id
      sfx.lift()
      set({ player: { ...G.player, ships: G.player.ships.filter((s) => s.id !== under.id) }, sel: id, horizontal: under.horizontal })
    }
    if (!id) return
    drag = { id, origin, sx: info.clientX, sy: info.clientY, moved: false, touch }
    refreshGhost(info)
    return
  }

  const d = drag
  if (info.phase === 'move') {
    if (d) {
      if (!d.moved && Math.hypot(info.clientX - d.sx, info.clientY - d.sy) > 6) d.moved = true
      refreshGhost(info)
    } else if (!touch) refreshGhost(info)
    return
  }

  // up
  drag = null
  if (!d) return
  const ghost = ghostFor(info, d.id, G.horizontal, true)

  if (d.origin && !d.moved) {
    const o = d.origin
    const flip = !o.horizontal
    const others = G.player.ships
    const tries = [{ r: o.r, c: o.c }, { r: clamp(o.r, 0, SIZE - o.length), c: clamp(o.c, 0, SIZE - o.length) }]
    const fit = tries.find((t) => canPlace(others, o.length, t.r, t.c, flip))
    if (fit) { deploy(o.id, fit.r, fit.c, flip); sfx.rotate() }
    else {
      commitPlayerShips(others.concat([o]))
      sfx.error()
      set({ ghost: null, horizontal: o.horizontal, hud: 'No room to rotate there' })
    }
    return
  }
  if (ghost && ghost.valid) { deploy(d.id, ghost.r, ghost.c, ghost.horizontal); return }
  if (d.origin) commitPlayerShips(G.player.ships.concat([d.origin]))
  if (ghost) { sfx.error(); set({ ghost: null, hud: 'Ships cannot overlap \u2014 try another spot' }) }
  else aim({ ghost: null })
}
function onTrayPointerDown(id, e) {
  if (G.phase !== 'placement' || e.button === 2) return
  set({ sel: id })
  const mk = (phase, ev) => {
    const p = ownView.toCell(ev.clientX, ev.clientY)
    return { phase, fr: p.fr, fc: p.fc, clientX: ev.clientX, clientY: ev.clientY, pointerType: ev.pointerType, button: ev.button }
  }
  handlePlacementPointer(mk('down', e))
  const cleanup = () => {
    window.removeEventListener('pointermove', move)
    window.removeEventListener('pointerup', up)
    window.removeEventListener('pointercancel', cancel)
  }
  const move = (ev) => handlePlacementPointer(mk('move', ev))
  const up = (ev) => { cleanup(); handlePlacementPointer(mk('up', ev)) }
  const cancel = (ev) => { cleanup(); handlePlacementPointer(mk('cancel', ev)) }
  window.addEventListener('pointermove', move)
  window.addEventListener('pointerup', up)
  window.addEventListener('pointercancel', cancel)
}
function selectShip(id) {
  sfx.click()
  set({ sel: id, hud: 'Place your ' + FLEET.find((f) => f.id === id).name })
}
function shuffleFleet() {
  const ships = autoPlaceFleet()
  if (!ships) return
  sfx.place()
  set({ player: { ...G.player, ships }, sel: null, ghost: null, hud: 'Fleet ready \u2014 press Open fire' })
  ships.forEach((s) => ownView.ripple(s.r, s.c, 0.5))
}
function clearFleet() {
  sfx.click()
  set({ player: { ...G.player, ships: [] }, sel: 'carrier', ghost: null, hud: 'Deploy your fleet' })
}

/* ---- enemy aiming ---- */
function handleEnemyPointer(info) {
  if (G.phase !== 'combat') return
  if (info.phase === 'leave') { if (!aimDown && G.reticle) aim({ reticle: null }); return }
  if (info.phase === 'cancel') { aimDown = false; aim({ reticle: null }); return }
  if (info.button === 2) return
  const touch = info.pointerType === 'touch'
  if (info.phase === 'down') { aimDown = true; sfx.unlock() }
  const canAim = G.turn === 'player' && !G.busy && !G.quiz
  if (!canAim) {
    if (info.phase === 'up') aimDown = false
    if (G.reticle) aim({ reticle: null })
    return
  }
  const r = Math.floor(info.fr - (touch ? 2.0 : 0))
  const c = Math.floor(info.fc)
  const inside = inBounds(r, c) && info.fr > -1.4 && info.fr < SIZE + 1.4
  const reticle = inside ? { r, c, valid: G.enemy.shots[r][c] === null, finger: touch && aimDown ? { fr: info.fr, fc: info.fc } : null } : null
  if (info.phase === 'up') {
    aimDown = false
    aim({ reticle: null })
    if (reticle && reticle.valid) firePlayer(r, c)
    else if (reticle) sfx.error()
    return
  }
  aim({ reticle })
}

ownView.onPointer = handlePlacementPointer
enemyView.onPointer = handleEnemyPointer

/* ---- static controls ---- */
$('muteBtn').addEventListener('click', () => {
  const next = !sfx.isMuted()
  sfx.setMuted(next)
  set({ muted: next })
  if (!next) sfx.click()
})
$('levelBtn').addEventListener('click', toMenu)
$('newBtn').addEventListener('click', () => startPlacement())
$('reloadBtn').addEventListener('click', openQuiz)
$('rotateBtn').addEventListener('click', rotate)
$('shuffleBtn').addEventListener('click', shuffleFleet)
$('clearBtn').addEventListener('click', clearFleet)
$('readyBtn').addEventListener('click', startCombat)
document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', () => set({ view: b.dataset.view })))
window.addEventListener('keydown', (e) => {
  if ((e.key === 'r' || e.key === 'R') && G.phase === 'placement') { e.preventDefault(); rotate() }
})

startBackdrop()
render()
})()
</script>
</body>
</html>
