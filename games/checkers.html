<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Checkers vs Robot</title>
<style>
:root{--bg1:#dfe9f2;--bg2:#f6f9fc;--g1:#b9d6ee;--tx:#16222e;--pn:rgba(255,255,255,.7);--bd:#b4c5d4;--s:min(calc((100vw - 44px)/8),calc((100vh - 250px)/8),78px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg1:#0b121a;--bg2:#17232f;--g1:#1d4258;--tx:#e8f1f8;--pn:rgba(20,32,44,.7);--bd:#2c4254}}

.pl{display:flex;align-items:center;gap:8px;background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:6px 10px}.pl small{display:block;opacity:.7}.pl.r{flex-direction:row-reverse;text-align:right}
.av{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#ffb09f,#e8473a 52%,#a3231b);box-shadow:0 3px 0 #7a1712;flex:none}

#board{position:relative;width:calc(var(--s)*8);height:calc(var(--s)*8);background:repeating-conic-gradient(#6b4631 0 25%,#ecd7ab 0 50%) 0 0/calc(var(--s)*2) calc(var(--s)*2);box-shadow:0 0 0 3px #2c1a10,inset 0 0 18px rgba(0,0,0,.35);cursor:pointer}
.pc{position:absolute;left:0;top:0;width:var(--s);height:var(--s);font-size:var(--s);z-index:2;transition:transform .38s cubic-bezier(.3,.8,.3,1),opacity .3s,scale .2s}
.pc::before{content:"";position:absolute;inset:10%;border-radius:50%;background:radial-gradient(circle at 35% 28%,var(--hi),var(--md) 52%,var(--lo));box-shadow:0 .07em 0 var(--ed),0 .14em .14em rgba(0,0,0,.45),inset 0 0 0 .05em rgba(255,255,255,.16),inset 0 -.1em .2em rgba(0,0,0,.25)}
.pc::after{content:"";position:absolute;inset:25%;border-radius:50%;border:.04em solid rgba(255,255,255,.4);box-shadow:inset 0 .02em .04em rgba(0,0,0,.3)}
.h{--hi:#ffb09f;--md:#e8473a;--lo:#a3231b;--ed:#7a1712}.a{--hi:#c8f8ff;--md:#2fb3d6;--lo:#136c8f;--ed:#0b4561}
.pc i{position:absolute;left:33%;top:37%;width:34%;height:27%;background:linear-gradient(#ffe27a,#f0a81e);clip-path:polygon(0 100%,0 25%,25% 58%,50% 0,75% 58%,100% 25%,100% 100%);opacity:0;scale:.4;transition:.3s;z-index:1}.k i{opacity:1;scale:1}
.sel::before{box-shadow:0 0 0 .05em #ffe066,0 0 .3em .06em #ffe066,0 .07em 0 var(--ed)}
.mv::before{animation:pu 1.6s infinite}@keyframes pu{50%{filter:brightness(1.3)}}

#hl{position:absolute;inset:0}.tg{position:absolute;left:0;top:0;width:var(--s);height:var(--s);display:grid;place-items:center;pointer-events:none}

.think .ey{animation:bl .45s infinite alternate}@keyframes bl{to{transform:scaleY(.2)}}
.ctl{display:flex;gap:10px}select,.ctl button,#ov button{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;cursor:pointer}.ctl button:hover{filter:brightness(1.1)}
#ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,10,16,.55);z-index:99}#ov[hidden]{display:none}
#ov div{background:var(--bg2);border:1px solid var(--bd);border-radius:18px;padding:24px 34px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}#ov h2{margin:0 0 14px}
body{background:#f3e9d2!important;color:#2a2118!important}
h1{color:#2a2118}.pl,#status,select,.ctl button,#ov button{background:#fff8e6!important;color:#2a2118!important;border:3px solid #2a2118!important;box-shadow:3px 3px 0 #2a2118}

#board{background:repeating-conic-gradient(#c8794a 0 25%,#f6e3b4 0 50%) 0 0/calc(var(--s)*2) calc(var(--s)*2);box-shadow:none;outline:4px solid #2a2118}
.h{--md:#ef5b4c;--hi:#ffb4a8}.a{--md:#3cc0d6;--hi:#b3f1fa}

.pc::after{border:.035em solid var(--hi);box-shadow:none}
.pc i{background:#ffd23f}
.mv::before{animation:none;box-shadow:0 0 0 .035em #ffd23f,0 .06em 0 #2a2118}
.sel::before{box-shadow:0 0 0 .06em #ffd23f,0 .06em 0 #2a2118}
.tg::after{background:#ffd23f;border:3px solid #2a2118;box-shadow:none;animation:none}
#ov div{background:#fff8e6;color:#2a2118;border:4px solid #2a2118;box-shadow:6px 6px 0 #2a2118}

/* ===== retro look (games/pixel.js): flat colors, chunky pixels, 8-bit font, no shading or shadows ===== */
body{font-size:10px}
h1{font-size:clamp(10px,3vw,18px);letter-spacing:.06em}h1 span{font-size:.5em;letter-spacing:.1em;margin-top:6px}
.pl,#status,select,.ctl button,#ov div,#ov button{border-radius:0!important;box-shadow:none!important}
.pl{gap:6px!important;padding:6px 8px!important}.pl small{margin-top:4px;font-size:8px;white-space:nowrap}.av{width:26px!important;height:26px!important}#rob{width:32px;height:32px}
#status{font-size:10px;padding:8px 12px}
#hud{font-size:10px!important}
select,.ctl button{font-size:10px!important;padding:10px 12px!important}
#board{background:repeating-conic-gradient(#c8794a 0 25%,#f6e3b4 0 50%) 0 0/calc(var(--s)*2) calc(var(--s)*2)}   /* flat squares, sharp on every browser */
@media(max-width:600px){main{padding-top:58px}}   /* room for the app's close button */
.frame{border-radius:0;background:#b5683c;box-shadow:none}
.pc::before{background:var(--img) center/100% 100% no-repeat;border:none;border-radius:0;box-shadow:none;image-rendering:pixelated}
.pc::after{display:none}
.h{--img:var(--px-red)}.a{--img:var(--px-blue)}
.pc i{background:var(--px-crown) center/100% 100% no-repeat;clip-path:none;image-rendering:pixelated;left:30%;top:33%;width:40%;height:29%}
.mv::before{box-shadow:none}
.sel::before{box-shadow:none;outline:3px solid #ffd23f;outline-offset:2px}
.tg::after{background:var(--px-dot) center/100% 100% no-repeat;border:none;border-radius:0;image-rendering:pixelated}

.rob .ey{transform-box:fill-box;transform-origin:center}
</style></head><body class="px"><main>
<header><div class="pl"><span class="av"></span><div><b>You</b><small id="nh">12 pieces</small></div></div>
<h1>Checkers<span>human vs robot</span></h1>
<div class="pl r"><svg class="rob" id="rob" viewBox="0 0 64 64" width="42" height="42"><path d="M32 4v10" stroke="#8aa0b3" stroke-width="3"/><circle cx="32" cy="5" r="4" fill="#3ee6ff"/><rect x="8" y="14" width="48" height="40" rx="12" fill="#cfd9e3" stroke="#33414f" stroke-width="3"/><rect x="14" y="24" width="36" height="18" rx="9" fill="#17212b"/><circle class="ey" cx="25" cy="33" r="4.5" fill="#3ee6ff"/><circle class="ey" cx="39" cy="33" r="4.5" fill="#3ee6ff"/><rect x="22" y="46" width="20" height="3" rx="1.5" fill="#33414f"/></svg><div><b>RX-9</b><small id="na">12 pieces</small></div></div></header>
<div id="status">Your move</div>
<div id="hud">Question in <b id="am">3</b> moves</div>
<div class="frame"><div id="board"><div id="hl"></div><div id="pieces"></div></div></div>
<div class="ctl"><select id="lv"><option value="2">Easy</option><option value="4" selected>Medium</option><option value="6">Hard</option></select><button id="nw">New game</button></div>

<script src="quiz-modal.js"></script>
<script src="pixel.js"></script>
<script>
/* Retro pixel art for the pieces, board, crown and robot, drawn once at start and handed to the CSS */
(function(){
  const INK='#2a2118', root=document.documentElement.style, url=u=>'url('+u+')';
  const piece=c=>PX.sprite(12,12,g=>PX.disc(g,6,6,6,c,{outline:INK,noShine:true}));   // one flat color
  root.setProperty('--px-red',url(piece('#ef5b4c')));
  root.setProperty('--px-blue',url(piece('#3cc0d6')));
  root.setProperty('--px-crown',url(PX.sprite(7,5,g=>PX.map(g,['Y..Y..Y','YYYYYYY','YYYYYYY','YYYYYYY','YYYYYYY'],{Y:'#ffd23f'}))));
  root.setProperty('--px-dot',url(PX.sprite(6,6,g=>PX.disc(g,3,3,3,'#ffd23f',{outline:INK,noShine:true}))));
  // the robot's head as pixel squares; its eyes are separate so they can still blink while it thinks
  const C={k:'#33414f',g:'#cfd9e3',v:'#17212b',c:'#3ee6ff'};
  const body=PX.svg(16,16,g=>PX.map(g,[
    '.......c........',
    '.......k........',
    '..kkkkkkkkkkkk..',
    '..kggggggggggk..',
    '..kgvvvvvvvvgk..',
    '..kgvvvvvvvvgk..',
    '..kgvvvvvvvvgk..',
    '..kgvvvvvvvvgk..',
    '..kggggggggggk..',
    '..kgggkkkkgggk..',
    '..kggggggggggk..',
    '..kkkkkkkkkkkk..'],C,0,2));
  const eye=x=>'<g class="ey">'+PX.svg(16,16,g=>{g.fillStyle=C.c;g.fillRect(x,7,2,2)})+'</g>';
  const rob=document.getElementById('rob');rob.setAttribute('viewBox','0 0 16 16');rob.innerHTML=body+eye(5)+eye(9);
})();
</script>
<script>
const $=q=>document.querySelector(q);
const B=$('#board'),PL=$('#pieces'),HL=$('#hl');
const K=p=>p[0]*8+p[1];
const wait=t=>new Promise(r=>setTimeout(r,t));

let S=72;
let b=[], turn=1, busy=false, over=false, legal=[];
let cand=null, kk=1, cur=-1, q=0;
const ps=new Map();
let hintTimer=null;

/* A question pops up every 3 of your moves. A wrong answer gives no moves, so a different
   question comes up right away — keep going until you get one right. */
const KIT=GameKit({id:'checkers',ammo:3,gainCorrect:3,gainWrong:0,maxWrong:Infinity,onUpdate:hud,
  getScore:()=>(12-b.filter(v=>v<0).length)*100,restart:newGame});
function hud(){$('#am').textContent=KIT.ammo;}

/* ---------------- rules ---------------- */
const dirs=v=>Math.abs(v)==2?[[1,1],[1,-1],[-1,1],[-1,-1]]:v>0?[[-1,1],[-1,-1]]:[[1,1],[1,-1]];

function jump(b,r,c,v,s,path,caps,out){
  let f=0;
  for(const[dr,dc]of dirs(v)){
    const mr=r+dr,mc=c+dc,tr=r+2*dr,tc=c+2*dc;
    if(tr<0||tr>7||tc<0||tc>7)continue;
    if(b[mr*8+mc]*s>=0||b[tr*8+tc])continue;
    f=1;
    const nb=b.slice();nb[r*8+c]=0;nb[mr*8+mc]=0;
    const pr=Math.abs(v)==1&&(s==1?tr==0:tr==7);
    nb[tr*8+tc]=pr?2*s:v;
    if(pr)out.push({path:[...path,[tr,tc]],caps:[...caps,[mr,mc]]});
    else jump(nb,tr,tc,v,s,[...path,[tr,tc]],[...caps,[mr,mc]],out);
  }
  if(!f&&caps.length)out.push({path,caps});
}

/* ALL legal moves: captures AND simple moves to open squares. */
function gen(b,s){
  const cp=[],sm=[];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const v=b[r*8+c];
    if(v*s<=0)continue;
    jump(b,r,c,v,s,[[r,c]],[],cp);
    for(const[dr,dc]of dirs(v)){
      const tr=r+dr,tc=c+dc;
      if(tr>=0&&tr<8&&tc>=0&&tc<8&&!b[tr*8+tc])sm.push({path:[[r,c],[tr,tc]],caps:[]});
    }
  }
  return [...cp,...sm];
}

function apply(b,m,s){
  const nb=b.slice(),P=m.path,e=P[P.length-1];
  let v=nb[K(P[0])];
  nb[K(P[0])]=0;
  m.caps.forEach(p=>nb[K(p)]=0);
  if(Math.abs(v)==1&&(s==1?e[0]==0:e[0]==7))v=2*s;
  nb[K(e)]=v;
  return nb;
}

function ev(b){
  let x=0;
  for(let i=0;i<64;i++){
    const v=b[i];if(!v)continue;
    const r=i>>3,c=i&7;
    let t=Math.abs(v)==2?175:100;
    if(Math.abs(v)==1){t+=v<0?r*4:(7-r)*4;if(v<0?r==0:r==7)t+=8}
    t+=(3.5-Math.abs(c-3.5))*1.5;
    x+=v<0?t:-t;
  }
  return x;
}

function nm(b,s,d,a,bt){
  const ms=gen(b,s);
  if(!ms.length)return -9000-d;
  if(d<=0)return -s*ev(b);
  for(const m of ms){
    const x=-nm(apply(b,m,s),-s,d-1,-bt,-a);
    if(x>a){a=x;if(a>=bt)break}
  }
  return a;
}

function pick(){
  const ms=gen(b,-1).sort(()=>Math.random()-.5);
  const d=+$('#lv').value;
  let best=-1e9,bm=ms[0];
  for(const m of ms){
    const x=-nm(apply(b,m,-1),1,d-1,-1e9,-best);
    if(x>best){best=x;bm=m}
  }
  return bm;
}

/* ---------------- board / pieces ---------------- */
const place=(e,r,c)=>{ e.style.transform='translate('+(c*S)+'px,'+(r*S)+'px)'; };

function mk(r,c,v){
  const e=document.createElement('div');
  e.className='pc '+(v>0?'h':'a');
  e.innerHTML='<i></i>';
  PL.appendChild(e);
  place(e,r,c);
  ps.set(r*8+c,e);
}

function pop(e){ if(!e)return; e.classList.add('gone'); setTimeout(()=>e.remove(),350); }

function layout(){
  const w=B.getBoundingClientRect().width;
  if(!w)return;
  S=w/8;
  ps.forEach((e,i)=>place(e,i>>3,i&7));
}

const status=t=>{
  if(hintTimer){clearTimeout(hintTimer);hintTimer=null}
  const el=$('#status');
  el.textContent=t;
  el.dataset.base=t;
};

function hint(msg){
  const el=$('#status');
  if(hintTimer)clearTimeout(hintTimer);
  el.textContent=msg;
  hintTimer=setTimeout(()=>{
    el.textContent=el.dataset.base||'Your move';
    hintTimer=null;
  },1600);
}

function counts(){
  let h=0,a=0;
  b.forEach(v=>{ if(v>0)h++; else if(v<0)a++; });
  $('#nh').textContent=h+' pieces';
  $('#na').textContent=a+' pieces';
}

function mark(){
  const show=turn===1&&!busy&&!over&&!cand;
  ps.forEach((e,i)=>{
    const can=show&&legal.some(m=>K(m.path[0])===i);
    e.classList.toggle('mv',can);
  });
}

function drawHL(){
  HL.innerHTML='';
  if(!cand)return;
  new Set(cand.map(m=>K(m.path[kk]))).forEach(i=>{
    const d=document.createElement('div');
    d.className='tg';
    d.style.transform='translate('+((i&7)*S)+'px,'+((i>>3)*S)+'px)';
    HL.appendChild(d);
  });
}

function clearSel(){
  if(cur>=0&&ps.get(cur))ps.get(cur).classList.remove('sel');
  cur=-1;cand=null;kk=1;
  HL.innerHTML='';
}

/* ---------------- game flow ---------------- */
function newGame(){
  PL.innerHTML='';HL.innerHTML='';ps.clear();
  b=Array(64).fill(0);
  for(let r=0;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2){
    if(r<3){b[r*8+c]=-1;mk(r,c,-1)}
    else if(r>4){b[r*8+c]=1;mk(r,c,1)}
  }
  turn=1;busy=false;over=false;q=0;
  cand=null;kk=1;cur=-1;
  $('#ov').hidden=true;
  $('#rob').classList.remove('think');
  layout();
  requestAnimationFrame(layout);
  counts();
  hud();
  startHuman();
}

function startHuman(){
  turn=1;busy=false;
  legal=gen(b,1);
  clearSel();
  $('#rob').classList.remove('think');
  if(!legal.length){ end('RX-9 wins!'); return; }
  if(KIT.ammo<=0){
    busy=true;mark();status(KIT.answers.length&&!KIT.answers[KIT.answers.length-1].correct?'Not quite — try this one!':'Question time!');
    KIT.ask(startHuman);
    return;
  }
  const hasCap=legal.some(m=>m.caps.length>0);
  status(hasCap?'Your move — captures available':'Your move');
  mark();
}

function finishTurn(m,side){
  counts();
  if(side===1){KIT.ammo--;hud();}
  if(m.caps.length)q=0; else q++;
  const nx=gen(b,-side);
  if(!nx.length)return end(side===1?'You win!':'RX-9 wins!');
  if(q>=80)return end('It’s a draw');
  if(side===1)aiTurn(); else startHuman();
}

function end(t){
  over=true;busy=false;
  clearSel();mark();
  status(t);
  setTimeout(()=>KIT.end(t==='You win!'),700);   // shows the result and sends the score to the app
}

/* ---------------- human input (fixed: destinations checked FIRST) ---------------- */
B.addEventListener('click',ev=>{
  if(busy||turn!==1||over)return;

  const R=B.getBoundingClientRect();
  const cs=R.width/8;
  const c=Math.floor((ev.clientX-R.left)/cs);
  const r=Math.floor((ev.clientY-R.top)/cs);
  if(r<0||r>7||c<0||c>7)return;
  const key=r*8+c;

  /* ---- 1) A piece is already selected: is this a legal destination? ---- */
  if(cand){
    const next=cand.filter(m=>K(m.path[kk])===key);
    if(next.length){ hop(next); return; }
    if(kk>1) return;               /* mid multi-jump: must continue */
  }

  /* ---- 2) Try to (re)select one of your pieces ---- */
  const moves=legal.filter(m=>K(m.path[0])===key);
  if(moves.length){
    clearSel();
    cand=moves;kk=1;cur=key;
    ps.get(key).classList.add('sel');
    drawHL();mark();
    return;
  }

  /* ---- 3) Invalid click: hint if it was your own stuck piece, else deselect ---- */
  const e=ps.get(key);
  if(e&&e.classList.contains('h')){
    hint('That piece has no legal moves right now.');
  }
  clearSel();
  mark();
});

function hop(nx){
  const from=cur;
  const to=K(nx[0].path[kk]);
  const e=ps.get(from);
  if(!e){ clearSel(); mark(); return; }

  cand=nx;
  ps.delete(from);
  ps.set(to,e);
  place(e,to>>3,to&7);
  cur=to;

  if(Math.abs((from>>3)-(to>>3))===2){
    const ck=(((from>>3)+(to>>3))/2)*8+(((from&7)+(to&7))/2);
    pop(ps.get(ck));
    ps.delete(ck);
  }

  kk++;
  const done=cand.find(m=>m.path.length===kk);
  if(!done){ drawHL(); return; }

  b=apply(b,done,1);
  if(Math.abs(b[to])===2)e.classList.add('k');
  e.classList.remove('sel');
  cand=null;kk=1;cur=-1;
  HL.innerHTML='';
  mark();
  finishTurn(done,1);
}

/* ---------------- robot turn ---------------- */
async function aiTurn(){
  turn=-1;busy=true;
  clearSel();mark();
  $('#rob').classList.add('think');
  status('RX-9 is thinking…');
  await wait(650);

  const m=pick();
  status('RX-9 is moving…');
  await robot(m);

  b=apply(b,m,-1);
  const endSq=K(m.path[m.path.length-1]);
  const el=ps.get(endSq);
  if(el&&Math.abs(b[endSq])===2)el.classList.add('k');

  busy=false;
  $('#rob').classList.remove('think');
  finishTurn(m,-1);
}

async function robot(m){
  const P=m.path;
  let curKey=K(P[0]);
  const e=ps.get(curKey);
  if(!e)return;

  for(let i=1;i<P.length;i++){
    const to=P[i];
    const toKey=K(to);

    ps.delete(curKey);
    ps.set(toKey,e);
    place(e,to[0],to[1]);
    await wait(420);

    if(m.caps[i-1]){
      const ck=K(m.caps[i-1]);
      pop(ps.get(ck));
      ps.delete(ck);
    }
    curKey=toKey;
    await wait(60);
  }
}

$('#nw').onclick=$('#ob').onclick=newGame;
addEventListener('resize',()=>{ if(!busy) layout(); });

newGame();
</script></body></html>
