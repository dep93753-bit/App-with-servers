<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connect 4 vs Robot</title>
<style>
:root{
  --bg:#f3e9d2; --ink:#2a2118; --board:#3c8fe0; --ring:#2a2118; --well:#e3d6b8;
  --me:#ef5b4c; --bot:#ffd23f; --metal:#fff8e6; --metal-d:#2a2118; --card:#fff8e6;
  --c:min(10.8vw,72px);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Avenir Next","Nunito",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;overflow-x:hidden}
h1{margin:0;font-size:clamp(26px,6vw,38px);font-weight:800;letter-spacing:-.02em}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.chip{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:rgba(75,63,208,.14);font-weight:700}
.chip i{width:16px;height:16px;border-radius:50%;display:inline-block}
#status{min-height:1.4em;font-weight:700;font-size:clamp(16px,4vw,20px);text-align:center}
button.btn,select{font:inherit;font-weight:700;color:var(--ink);background:transparent;border:2px solid var(--ink);border-radius:12px;padding:7px 14px;cursor:pointer}
button.btn{background:var(--ink);color:var(--bg)}
button.btn:focus-visible,select:focus-visible,.col:focus-visible{outline:3px solid var(--me);outline-offset:2px}

.stage{position:relative;width:calc(7*var(--c));padding-top:var(--c)}
.board{position:relative;z-index:1;width:calc(7*var(--c));height:calc(6*var(--c))}
.back{position:absolute;inset:0;background:var(--well);border-radius:20px;z-index:0}
.discs{position:absolute;inset:0;z-index:1}
.front{position:absolute;inset:0;z-index:2;border-radius:20px;pointer-events:none;
  background:radial-gradient(circle closest-side at center,transparent 0 84%,var(--ring) 85% 92%,var(--board) 93%);
  background-size:calc(100%/7) calc(100%/6);
  box-shadow:inset 0 0 0 6px rgba(255,255,255,.14),0 12px 0 var(--ring),0 24px 30px rgba(0,0,0,.25)}
.disc{position:absolute;width:calc(var(--c)*.82);height:calc(var(--c)*.82);border-radius:50%;
  left:calc(var(--col)*var(--c) + var(--c)*.09);top:calc(var(--row)*var(--c) + var(--c)*.09);
  transition:left .7s cubic-bezier(.6,0,.3,1),top var(--fall,.4s) cubic-bezier(.5,0,.9,.6);
  box-shadow:inset 0 calc(var(--c)*-.06) 0 rgba(0,0,0,.2)}
.disc::after{content:"";position:absolute;inset:20%;border-radius:50%;border:calc(var(--c)*.05) solid rgba(0,0,0,.2)}
.disc.h{background:var(--me)} .disc.a{background:var(--bot)}
.disc.a::after{border-style:dashed}
.disc.ghost{opacity:.45;pointer-events:none;transition:left .1s}
.disc.pop{animation:pop .2s}
.disc.land{animation:land .22s}
.disc.win{animation:glow .7s infinite alternate}
@keyframes pop{from{transform:scale(.2)}}
@keyframes land{40%{transform:scaleY(.9) translateY(3px)}}
@keyframes glow{to{box-shadow:0 0 0 5px #fff,0 0 20px #fff,inset 0 calc(var(--c)*-.06) 0 rgba(0,0,0,.2)}}

.cols{position:absolute;z-index:4;left:var(--c);right:0;top:calc(var(--c)*.5);bottom:0;display:grid;grid-template-columns:repeat(7,1fr)}
.col{background:none;border:0;padding:0;cursor:pointer;border-radius:14px}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}

/* ===== storybook look (matches Checkers): cream paper, ink outlines, flat colors, hard offset shadows ===== */
body{background:var(--bg) radial-gradient(rgba(42,33,24,.12) 1.2px,transparent 1.4px) 0 0/22px 22px;font-family:"Outfit",ui-rounded,system-ui,sans-serif}
h1{font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--bot);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink)}
.chip{background:var(--card);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-weight:800;padding:5px 12px;font-size:clamp(13px,3.6vw,16px);line-height:1.25}
.chip i{width:18px;height:18px;border:2.5px solid var(--ink)}
#status{display:inline-block;background:var(--card);border:3px solid var(--ink);border-radius:99px;padding:6px 18px;box-shadow:3px 3px 0 var(--ink);font-weight:800;
  font-size:clamp(14px,3.8vw,18px);line-height:1.3;max-width:92vw}
button.btn,select{border:3px solid var(--ink);background:var(--card);color:var(--ink);font-weight:800;box-shadow:3px 3px 0 var(--ink)}
button.btn{background:var(--bot);color:var(--ink)}
button.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
label{font-weight:800}
/* board: blue frame with ink-ringed holes and a hard shadow */
.back{border-radius:20px;background:var(--well);box-shadow:inset 0 0 0 4px var(--ink)}
.front{border-radius:20px;
  background:radial-gradient(circle closest-side at center,transparent 0 80%,var(--ink) 81% 89%,var(--board) 90%);
  background-size:calc(100%/7) calc(100%/6);
  box-shadow:0 0 0 4px var(--ink),9px 9px 0 4px var(--ink)}
.front::after{content:"";position:absolute;left:12px;right:12px;top:-14px;height:10px}
/* discs: flat color, ink outline, inner ring, shine */
.disc{border:3px solid var(--ink);box-shadow:inset -3px -4px 0 rgba(0,0,0,.18)}
.disc::after{inset:18%;border:calc(var(--c)*.04) solid rgba(42,33,24,.35)}
.disc::before{content:"";position:absolute;left:18%;top:14%;width:26%;height:16%;border-radius:50%;background:rgba(255,255,255,.75);transform:rotate(-30deg)}
.disc.win{animation:winPop .6s infinite alternate}
@keyframes winPop{to{transform:scale(1.1);box-shadow:0 0 0 4px var(--card),0 0 0 7px var(--ink)}}

/* ===== retro look (games/pixel.js): flat colors, chunky pixels, 8-bit font, no shading or shadows ===== */
body{background:var(--bg);font-size:10px;gap:16px}
h1{font-size:clamp(16px,5vw,26px);font-weight:400;letter-spacing:.06em;color:var(--ink);-webkit-text-stroke:0;text-shadow:none}
.chip,#status,button.btn,select{border-radius:0;box-shadow:none!important;font-weight:400;font-size:10px}
button.btn{border:3px solid var(--ink)!important}
.chip{padding:8px 10px}.chip i{border-radius:0;width:12px;height:12px;border-width:2px}
#status{padding:8px 12px;line-height:1.6}
button.btn,select{padding:10px 12px}
button.btn:active{transform:translateY(3px)}
.cols{left:0;top:0}
.back{border-radius:0;box-shadow:none}
.front{border-radius:0;background:var(--px-hole) 0 0/calc(100%/7) calc(100%/6);image-rendering:pixelated;box-shadow:0 0 0 4px var(--ink)}
.front::after{display:none}
.disc{border:none;border-radius:0;box-shadow:none;background:var(--img) center/100% 100% no-repeat!important;image-rendering:pixelated}
.disc::before,.disc::after{display:none}
.disc.h{--img:var(--px-red)}.disc.a{--img:var(--px-yellow)}
.disc.win{animation:winPop .4s steps(2) infinite alternate}
@keyframes winPop{to{transform:scale(1.12)}}
.col{border-radius:0}
</style>
</head>
<body class="px">
<h1>Connect 4</h1>
<div class="bar">
  <div class="chip"><i style="background:var(--me)"></i>You <span id="sh">0</span></div>
  <div class="chip"><i style="background:var(--bot)"></i>Robot <span id="sa">0</span></div>
  <div class="chip">Moves <span id="am">0</span></div>
  <div class="chip">Strikes <span id="wr">0</span>/3</div>
</div>
<div id="status" aria-live="polite"></div>

<div class="stage" id="stage">
  <div class="board">
    <div class="back"></div>
    <div class="discs" id="discs"></div>
    <div class="front"></div>
  </div>
  <div class="cols" id="cols"></div>
</div>

<div class="bar" style="margin-top:14px">
  <button class="btn" id="again">New game</button>
  <label>Robot level
    <select id="lvl"><option value="2">Easy</option><option value="4" selected>Medium</option><option value="6">Hard</option></select>
  </label>
</div>

<script src="quiz-modal.js?v=3"></script>
<script src="pixel.js?v=3"></script>
<script>
/* Retro pixel art for the discs and board holes, drawn once and handed to the CSS */
(function(){
  const INK='#2a2118', root=document.documentElement.style, url=u=>'url('+u+')';
  const disc=c=>PX.sprite(14,14,g=>PX.disc(g,7,7,7,c,{outline:c,noShine:true}));      // one flat color, no outline
  root.setProperty('--px-red',url(disc('#ef5b4c')));
  root.setProperty('--px-yellow',url(disc('#ffd23f')));
  root.setProperty('--px-hole',url(PX.sprite(16,16,g=>{            // one board cell: plain blue with a round hole
    g.fillStyle='#3c8fe0';g.fillRect(0,0,16,16);
    for(let y=0;y<16;y++)for(let x=0;x<16;x++)if(Math.hypot(x+.5-8,y+.5-8)<6.6)g.clearRect(x,y,1,1);
  })));
})();
</script>
<script>
const R=6,C=7,H=1,A=2,ORDER=[3,2,4,1,5,0,6];
const $=s=>document.querySelector(s), sleep=ms=>new Promise(r=>setTimeout(r,ms));
const discs=$('#discs'),statusEl=$('#status');
let g,over,busy,ghost,sc={h:0,a:0},won=false;

/* Each disc you drop uses 1 "move". At 0 moves you answer a question to get more; 3 wrong answers = game over. */
const KIT=GameKit({id:'connect4',ammo:6,gainCorrect:5,gainWrong:1,maxWrong:3,onUpdate:hud,
  getScore:()=>won?100+5*g.flat().filter(v=>!v).length:0,restart:newGame});
function hud(){$('#am').textContent=KIT.ammo;$('#wr').textContent=KIT.wrong;}
function needMoves(){                     // out of moves: ask a question before the next turn
  if(KIT.ammo>0||over)return;
  busy=true;say('Out of moves — answer a question!');
  KIT.ask(()=>{busy=false;say('Your turn — pick a column.');});
}

/* ---------- game logic ---------- */
const drop=(b,c,p)=>{for(let r=R-1;r>=0;r--)if(!b[r][c]){b[r][c]=p;return r}return -1};
function winCells(b,r,c,p){
  for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){
    const cells=[[r,c]];
    for(const s of [1,-1]){let y=r+dr*s,x=c+dc*s;
      while(y>=0&&y<R&&x>=0&&x<C&&b[y][x]===p){cells.push([y,x]);y+=dr*s;x+=dc*s}}
    if(cells.length>=4)return cells;
  }
  return null;
}
function evalBoard(b){ // from the robot's view
  let s=0;
  for(let r=0;r<R;r++)if(b[r][3]===A)s+=3; else if(b[r][3]===H)s-=3;
  for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]])
    for(let r=0;r<R;r++)for(let c=0;c<C;c++){
      const er=r+dr*3,ec=c+dc*3; if(er<0||er>=R||ec<0||ec>=C)continue;
      let a=0,h=0;
      for(let k=0;k<4;k++){const v=b[r+dr*k][c+dc*k]; if(v===A)a++; else if(v===H)h++}
      if(a&&h)continue;
      if(a===3)s+=6; else if(a===2)s+=2;
      if(h===3)s-=8; else if(h===2)s-=2;
    }
  return s;
}
function negamax(b,d,al,be,p){
  let any=false,best=-Infinity;
  for(const c of ORDER){
    if(b[0][c])continue; any=true;
    const r=drop(b,c,p); let v;
    if(winCells(b,r,c,p))v=1e6+d;
    else if(d<=1)v=(p===A?1:-1)*evalBoard(b);
    else v=-negamax(b,d-1,-be,-al,3-p);
    b[r][c]=0;
    if(v>best)best=v; if(best>al)al=best; if(al>=be)break;
  }
  return any?best:0;
}
function pickMove(){
  const lvl=+$('#lvl').value, open=ORDER.filter(c=>!g[0][c]);
  if(lvl===2&&Math.random()<.3)return open[Math.floor(Math.random()*open.length)];
  let best=-Infinity,bc=open[0];
  for(const c of open){
    const r=drop(g,c,A); let v;
    if(winCells(g,r,c,A))v=1e7;
    else v=-negamax(g,lvl-1,-Infinity,Infinity,H);
    g[r][c]=0;
    if(v>best){best=v;bc=c}
  }
  return bc;
}

/* ---------- visuals ---------- */
const say=t=>statusEl.textContent=t;
function makeDisc(p,col,row,cls=''){
  const d=document.createElement('div');
  d.className='disc '+(p===H?'h':'a')+' '+cls;
  d.style.setProperty('--col',col);d.style.setProperty('--row',row);
  discs.appendChild(d);return d;
}
async function fall(d,row){
  const t=.22+.06*(row+1);
  d.style.setProperty('--fall',t+'s');
  d.offsetWidth; d.style.setProperty('--row',row);
  await sleep(t*1000+40); d.classList.add('land');
}
function finish(p,r,c){
  const w=winCells(g,r,c,p);
  if(w){
    over=true;
    [...discs.querySelectorAll('.disc:not(.ghost)')].forEach(d=>{
      const col=+d.style.getPropertyValue('--col'),row=+d.style.getPropertyValue('--row');
      if(w.some(([y,x])=>y===row&&x===col))d.classList.add('win');
    });
    if(p===H){sc.h++;won=true;say('You win! Nice one.')} else {sc.a++;say('The robot wins this round.')}
    $('#sh').textContent=sc.h;$('#sa').textContent=sc.a;
    setTimeout(()=>KIT.end(p===H),1400);   // shows the result and sends the score to the app
    return true;
  }
  if(g[0].every(Boolean)){over=true;say('Draw — the board is full.');setTimeout(()=>KIT.end(false),1400);return true}
  return false;
}

async function humanMove(c){
  if(busy||over||g[0][c])return;
  if(KIT.ammo<=0){needMoves();return}
  busy=true; ghost.style.display='none';
  KIT.ammo--;hud();
  const r=drop(g,c,H), d=makeDisc(H,c,-1);
  await fall(d,r);
  if(!finish(H,r,c))await robotTurn();
  busy=false;
  needMoves();
}
async function robotTurn(){
  say('Robot is thinking…');
  await sleep(450);
  const c=pickMove(), r=drop(g,c,A), d=makeDisc(A,c,-1,'pop');   // its disc appears above the column and drops in
  await fall(d,r);
  if(!finish(A,r,c))say('Your turn — pick a column.');
}

function newGame(){
  g=Array.from({length:R},()=>Array(C).fill(0));
  over=false;busy=false;won=false;discs.innerHTML='';hud();
  ghost=makeDisc(H,3,-1,'ghost');ghost.style.display='none';
  say('Your turn — pick a column.');
}

/* ---------- setup ---------- */
const cols=$('#cols');
for(let c=0;c<C;c++){
  const b=document.createElement('button');
  b.className='col';b.setAttribute('aria-label','Drop in column '+(c+1));
  const show=()=>{if(!busy&&!over&&!g[0][c]){ghost.style.setProperty('--col',c);ghost.style.display=''}};
  b.addEventListener('mouseenter',show);b.addEventListener('focus',show);
  b.addEventListener('click',()=>humanMove(c));
  cols.appendChild(b);
}
cols.addEventListener('mouseleave',()=>ghost.style.display='none');
$('#again').addEventListener('click',newGame);
newGame();
</script>
</body>
</html>
